<!doctype html><meta charset="utf-8"><title>Sprite Check selection checks</title>
<style>body{margin:0;background:#101521;color:#d9ece3;font:12px Consolas,monospace}header{display:flex;align-items:center;gap:18px;padding:10px}button{background:#a5f1d0;color:#13261d;border:0;padding:10px;cursor:pointer}iframe{width:100%;height:calc(100vh - 58px);border:0}ol{position:fixed;top:50px;right:12px;max-width:530px;background:#10291ff2;line-height:1.7;padding:15px 30px}ol:empty{display:none}</style>
<header><button id="run">Run selection checks</button><button id="prepare">Prepare pointer check</button><button id="verify">Verify pointer selection</button><span id="status">Loading…</span></header><iframe id="app" src="../index.html" title="Selection test workspace"></iframe><ol id="results"></ol>
<script type="module">
const frame=document.getElementById('app'),status=document.getElementById('status'),results=document.getElementById('results');
const wait=async fn=>{const end=performance.now()+12000;while(!fn()){if(performance.now()>end)throw Error('Timed out');await new Promise(r=>setTimeout(r,25));}};
const assert=(v,msg)=>{if(!v)throw Error(msg);},add=msg=>{const li=document.createElement('li');li.textContent='PASS · '+msg;results.append(li);};
await wait(()=>frame.contentWindow.spriteCheck?.ready);
const w=frame.contentWindow,d=frame.contentDocument,$=id=>d.getElementById(id),app=w.spriteCheck;
const png=await(await fetch('../assets/test-sheet.png')).arrayBuffer();
async function fresh(){const transfer=new w.DataTransfer();transfer.items.add(new w.File([png],'selection.png',{type:'image/png'}));$('fileInput').files=transfer.files;$('fileInput').dispatchEvent(new w.Event('change',{bubbles:true}));await wait(()=>d.body.classList.contains('busy'));await wait(()=>!d.body.classList.contains('busy'));}
function at(row,column){return app.project.sheet.frames.find(f=>f.row===row&&f.column===column);}
function clickCell(cell){const canvas=$('sheetCanvas'),rect=canvas.getBoundingClientRect(),g=app.project.sheet.grid;canvas.dispatchEvent(new w.MouseEvent('click',{bubbles:true,clientX:rect.left+(cell.x+g.cellWidth/2)*rect.width/canvas.width,clientY:rect.top+(cell.y+g.cellHeight/2)*rect.height/canvas.height}));}
function pixelsMatch(source){const actual=$('previewCanvas'),expected=d.createElement('canvas'),cell=d.createElement('canvas'),g=app.project.sheet.grid;expected.width=actual.width;expected.height=actual.height;cell.width=g.cellWidth;cell.height=g.cellHeight;cell.getContext('2d').putImageData(new w.ImageData(source.data,g.cellWidth,g.cellHeight),0,0);const ctx=expected.getContext('2d');ctx.imageSmoothingEnabled=false;const f=Math.min(actual.width*.78/g.cellWidth,actual.height*.88/g.cellHeight),scale=f>=1?Math.floor(f):f;ctx.drawImage(cell,Math.floor((actual.width-g.cellWidth*scale)/2),Math.floor((actual.height-g.cellHeight*scale)/2),Math.max(1,Math.floor(g.cellWidth*scale)),Math.max(1,Math.floor(g.cellHeight*scale)));const a=actual.getContext('2d').getImageData(0,0,actual.width,actual.height).data,b=ctx.getImageData(0,0,actual.width,actual.height).data;return a.every((value,i)=>value===b[i]);}
function verify(source,index){const draft=app.project.draft[source.row],edited=draft.keys.findIndex(k=>k.sourceId===source.id),animation=edited<0?app.project.sheet.original[source.row]:draft,keyIndex=index??(edited<0?animation.keys.findIndex(k=>k.sourceId===source.id):edited),start=animation.keys.slice(0,keyIndex).reduce((n,k)=>n+k.ticks,0)/animation.fps;assert(!app.playing,'Selection must pause');assert(Math.abs(app.time-start)<1e-9,'Wrong key start time');assert(pixelsMatch(source),'Preview pixels do not match clicked source');assert(Number($('sourceFrame').value)===source.id,'Inspector differs');assert($('previewCounter').textContent===`${String(keyIndex+1).padStart(2,'0')} / ${animation.keys.length}`,'Wrong preview counter');assert(app.mode===(edited<0?'original':'edited'),'Wrong playback mode');}
function change(id,value){$(id).value=value;$(id).dispatchEvent(new w.Event('change',{bubbles:true}));}
status.textContent='Ready';
document.getElementById('run').onclick=async()=>{results.replaceChildren();status.textContent='Running…';try{
 await fresh();let source=at(8,5),before=JSON.stringify(app.project.draft);clickCell(source);verify(source);assert(JSON.stringify(app.project.draft)===before&&app.project.undoStack.length===0,'Selection edited document');add('Center cell selects matching pixels, row, key, time; no document/history edit');
 clickCell(at(8,0));change('holdTicks',5);clickCell(source);verify(source);assert(Math.abs(app.time-9/12)<1e-9,'Ignored held ticks');add('Seek uses preceding Hold durations instead of column / FPS');
 $('duplicateKey').click();d.querySelector('#keyframes [data-index="6"]').click();verify(source,6);clickCell(source);verify(source,5);add('Repeated references: timeline selects its occurrence; sheet selects first occurrence');
 $('play').click();await new Promise(r=>setTimeout(r,100));assert(app.playing,'Play failed');clickCell(at(9,7));verify(at(9,7));const paused=app.time;await new Promise(r=>setTimeout(r,100));assert(app.time===paused,'Click kept animating');add('Selecting another row while playing pauses and holds the chosen image');
 clickCell(source);$('deleteKey').click();clickCell(source);$('deleteKey').click();before=JSON.stringify(app.project.draft);clickCell(source);verify(source);assert($('selectedLabel').textContent==='SOURCE FRAME'&&JSON.stringify(app.project.draft)===before,'Removed frame was reinserted');$('addKey').click();assert(app.project.draft[8].keys.at(-1).sourceId===source.id,'Cannot add removed source');add('Deleted sources preview via Original without reinserting; Add Key still works');
 clickCell(at(4,0));while(app.project.draft[4].keys.length)$('deleteKey').click();clickCell(at(4,3));verify(at(4,3));assert(app.project.draft[4].keys.length===0,'Empty draft changed');add('Source frames remain inspectable when the edited row is empty');
 const oldTime=app.time,oldImage=$('previewCanvas').toDataURL();clickCell(app.project.sheet.cells.find(c=>c.row===4&&!c.occupied));assert(app.time===oldTime&&$('previewCanvas').toDataURL()===oldImage,'Empty cell changed preview');add('Clicking an empty sheet cell leaves preview unchanged');
 $('zoomIn').click();$('sheetViewport').scrollTop=650;$('sheetViewport').scrollLeft=100;clickCell(at(9,6));verify(at(9,6));add('Scaled and scrolled sheet coordinates still select the correct frame');
 await fresh();$('confirm').click();$('merge').click();await wait(()=>app.project.merged&&!d.body.classList.contains('busy'));const packed=app.project.merged.frames.find(f=>f.row===8&&f.column===5),original=app.project.sheet.frames[packed.sourceId];clickCell(packed);verify(original);assert(app.project.merged,'Selection invalidated Merge');add('Merged sheet cell previews its original image and retains the packed result');
 status.textContent='PASS 9 / 9';document.body.dataset.result='pass';
 }catch(error){status.textContent='FAIL '+error.message;document.body.dataset.result='fail';console.error(error);}};
document.getElementById('prepare').onclick=async()=>{await fresh();results.hidden=true;d.querySelector('[data-row="8"]').click();status.textContent='Click R9 C6 in sheet, then Verify pointer selection';};
document.getElementById('verify').onclick=()=>{try{verify(at(8,5));status.textContent='PASS real pointer R9 C6: pixels, paused, time 0.417 s';}catch(error){status.textContent='FAIL '+error.message;}};
</script>
