<!doctype html><meta charset="utf-8"><title>Sprite Check 1.2 workflow checks</title>
<style>body{margin:0;background:#101521;color:#d9ece3;font:12px Consolas,monospace}header{display:flex;align-items:center;gap:18px;padding:10px}button{background:#a5f1d0;color:#13261d;border:0;padding:10px;cursor:pointer}iframe{width:100%;height:calc(100vh - 58px);border:0}ol{position:fixed;top:50px;right:12px;max-width:540px;background:#10291ff2;line-height:1.7;padding:15px 30px;max-height:55vh;overflow:auto}ol:empty{display:none}</style>
<header><button id="run">Run v1.2 workflow checks</button><button id="show">Show merged sheets</button><button id="hide">Hide results</button><button id="verifyPan">Verify pointer pan</button><span id="status">Loading…</span></header><iframe id="app" src="../index.html" title="Workflow test workspace"></iframe><ol id="results"></ol>
<script type="module">
const frame=document.getElementById('app'),status=document.getElementById('status'),results=document.getElementById('results');
const wait=async condition=>{const end=performance.now()+12000;while(!condition()){if(performance.now()>end)throw Error('Timed out');await new Promise(r=>setTimeout(r,25));}};
const assert=(v,msg)=>{if(!v)throw Error(msg);};const add=msg=>{const li=document.createElement('li');li.textContent='PASS · '+msg;results.append(li);};
await wait(()=>frame.contentWindow.spriteCheck?.ready);status.textContent='Ready';
async function input(id,bytes,name,type){const w=frame.contentWindow,d=frame.contentDocument,transfer=new w.DataTransfer();transfer.items.add(new w.File([bytes],name,{type}));d.getElementById(id).files=transfer.files;
 await new Promise((resolve,reject)=>{let started=false;const timeout=setTimeout(()=>{observer.disconnect();reject(Error('Input timed out'));},12000);const observer=new MutationObserver(()=>{if(d.body.classList.contains('busy'))started=true;else if(started){clearTimeout(timeout);observer.disconnect();resolve();}});observer.observe(d.body,{attributes:true,attributeFilter:['class']});d.getElementById(id).dispatchEvent(new w.Event('change',{bubbles:true}));});}
document.getElementById('run').onclick=async()=>{results.replaceChildren();status.textContent='Running…';try{
 const w=frame.contentWindow,d=frame.contentDocument,app=w.spriteCheck,$=id=>d.getElementById(id);
 assert(app.project===null&&!$('emptyState').hidden&&$('sheetCanvas').hidden,'Startup not empty');assert(!w.performance.getEntriesByType('resource').some(e=>e.name.endsWith('test-sheet.png')),'Auto-loaded demo');add('New startup has no sheet, rows or implicit demo request');
 assert($('play').disabled&&$('detect').disabled&&$('saveProject').disabled&&$('rows').children.length===0,'Empty controls unsafe');add('Empty workspace disables project actions and keeps import available');
 const png=await(await fetch('../assets/test-sheet.png')).arrayBuffer();await input('fileInput',png,'workflow.png','image/png');assert(app.project.draft.length===12&&app.project.draft.every(a=>a.loop),'Loop defaults');add('Explicit PNG import creates 12 rows, all Loop by default');
 const button=d.querySelector('[data-row="4"]');button.click();assert(button===d.querySelector('[data-row="4"]'),'Click replaced row target');button.click();button.dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));await new Promise(r=>setTimeout(r,150));assert(app.playing&&app.time>0&&app.project.draft[4].name==='Hit FL','Double click did not play');$('play').click();add('Stable row target supports double-click playback on Hit FL');
 $('compareTab').click();assert(!$('compareViewport').hidden&&app.project.merged===null,'Compare gated');assert($('compareOriginalInfo').textContent.includes('5 ticks'),'Original info absent');assert($('compareRightTitle').textContent.includes('EDITED PREVIEW'),'Draft mislabeled');assert($('compareOriginal').getContext('2d').getImageData(0,0,$('compareOriginal').width,$('compareOriginal').height).data.some((v,i)=>i%4===3&&v),'Original not drawn');add('Compare renders original and edited animation before Confirm or Merge');
 $('compareOriginalMode').value='sheet';$('compareOriginalMode').dispatchEvent(new w.Event('change'));assert(app.compare.left.mode==='sheet'&&app.compare.right.mode==='sheet','Linked view not applied');assert($('compareLogState').textContent.includes('PENDING')&&$('compareLogRows').rows[0].cells[2].textContent==='—','Invented output');add('Full-sheet view works before Merge, with pending output clearly marked');
 if($('compareLog').hidden)$('compareLogToggle').click();$('compareLogToggle').click();assert($('compareLog').hidden,'Log not hidden');$('compareLogToggle').click();assert(!$('compareLog').hidden,'Log not restored');$('compareOriginalIn').click();assert(app.compare.left.zoom>1,'Zoom failed');$('compareOriginalFit').click();assert(app.compare.left.zoom===1&&app.compare.left.x===0,'Fit failed');$('compareOriginalActual').click();assert($('compareOriginalZoom').textContent==='100%','1:1 failed');add('Viewport Zoom, Fit, 1:1 and hide/show log to enlarge preview work');
 $('compareLink').click();$('compareMergedMode').value='animation';$('compareMergedMode').dispatchEvent(new w.Event('change'));const other=app.compare.right.zoom;$('compareOriginalIn').click();$('compareSplit').value=65;$('compareSplit').dispatchEvent(new w.Event('input'));await new Promise(r=>requestAnimationFrame(r));assert(app.compare.right.zoom===other&&app.compare.right.mode==='animation'&&app.compare.left.mode==='sheet','Independent view changed peer');assert($('compareOriginalStage').clientWidth>$('compareMergedStage').clientWidth,'Split width unchanged');add('Independent animation/sheet views and adjustable left/right viewport widths');
 $('confirm').click();$('merge').click();await wait(()=>app.project.merged&&!d.body.classList.contains('busy'));assert(!$('compareViewport').hidden,'Merge left Compare');const encoded=await app.encodePNG(app.project.merged);assert($('compareFileBytes').textContent.includes(`PNG ${encoded.length} B`),'PNG bytes differ');assert($('compareLogRows').rows[0].cells[2].textContent==='1260 × 1380 px','Resolution differs');assert($('compareLogRows').rows[4].cells[2].textContent==='107','Image count differs');add('Merge updates measured PNG/JSON, resolution, image count and area/file savings');
 $('holdTicks').value=3;$('holdTicks').dispatchEvent(new w.Event('change'));assert(!app.project.merged&&!$('compareViewport').hidden,'Edit left Compare');assert($('compareRightTitle').textContent.includes('EDITED PREVIEW')&&$('compareLogRows').rows[1].cells[2].textContent==='—','Stale output statistics');add('Editing after Merge keeps Compare open and clears stale output statistics');
 $('loop').click();const settings=JSON.stringify(app.compare),dat=await app.saveDAT();await input('fileInput',png,'reset.png','image/png');await input('projectInput',dat,'workflow.dat','application/octet-stream');assert(!$('compareViewport').hidden&&!app.project.merged&&JSON.stringify(app.compare)===settings,'DAT view lost');assert(!app.project.draft[4].loop&&app.project.draft[5].loop,'Explicit loop setting lost');add('DAT restores pre-merge Compare, viewport settings and explicit Loop overrides');
 const fresh=document.createElement('iframe');fresh.hidden=true;fresh.src='../index.html?empty-check';document.body.append(fresh);await wait(()=>fresh.contentWindow.spriteCheck?.ready);assert(fresh.contentWindow.spriteCheck.project===null,'New instance restored demo');fresh.remove();add('A second fresh instance still opens empty after earlier imports');
 status.textContent='PASS 12 / 12';document.body.dataset.result='pass';
 }catch(error){status.textContent='FAIL '+error.message;document.body.dataset.result='fail';const li=document.createElement('li');li.textContent=status.textContent;results.append(li);console.error(error);}};
document.getElementById('hide').onclick=()=>{results.hidden=!results.hidden;};
document.getElementById('show').onclick=async()=>{const d=frame.contentDocument,w=frame.contentWindow,$=id=>d.getElementById(id);if(!w.spriteCheck.project)return;$('confirm').click();$('merge').click();await wait(()=>w.spriteCheck.project.merged&&!d.body.classList.contains('busy'));$('compareTab').click();if(!$('compareLink').checked)$('compareLink').click();$('compareOriginalMode').value='sheet';$('compareOriginalMode').dispatchEvent(new w.Event('change'));$('compareOriginalFit').click();$('compareSplit').value=50;$('compareSplit').dispatchEvent(new w.Event('input'));results.hidden=true;};
</script>

<script>document.getElementById('verifyPan').onclick=()=>{const c=document.getElementById('app').contentWindow.spriteCheck.compare;document.getElementById('status').textContent=(Math.abs(c.left.x)>1||Math.abs(c.left.y)>1)?`PASS native pointer pan: x=${c.left.x}, y=${c.left.y}`:'FAIL pointer pan unchanged';};</script>
