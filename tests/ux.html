<!doctype html><meta charset="utf-8"><title>Sprite Check UX and bug checks</title>
<style>body{margin:0;background:#101521;color:#d9ece3;font:12px Consolas,monospace}header{display:flex;gap:12px;align-items:center;padding:8px;flex-wrap:wrap}button{padding:9px;background:#a5f1d0;border:0;cursor:pointer}iframe{display:block;width:100%;height:660px;border:0}ol{position:fixed;top:45px;right:12px;max-width:540px;max-height:65vh;overflow:auto;background:#10291ff2;padding:15px 30px;line-height:1.6}ol:empty{display:none}</style>
<header><button id="audit">Reproduce baseline bugs</button><button id="run">Run UX regression</button><button id="hide">Hide results</button><span id="status">Loading…</span></header><iframe id="app" src="../index.html" title="UX test workspace"></iframe><ol id="results"></ol><pre hidden id="report"></pre>
<script type="module">
const frame=document.getElementById('app'),results=document.getElementById('results'),status=document.getElementById('status');
const wait=async fn=>{const end=performance.now()+12000;while(!fn()){if(performance.now()>end)throw Error('Timed out');await new Promise(r=>setTimeout(r,20));}};
await wait(()=>frame.contentWindow.spriteCheck?.ready);const w=frame.contentWindow,d=frame.contentDocument,$=id=>d.getElementById(id),app=w.spriteCheck;
const png=await(await fetch('../assets/test-sheet.png')).arrayBuffer();
async function fresh(){const previous=app.project,files=new w.DataTransfer();files.items.add(new w.File([png],'ux-test.png',{type:'image/png'}));$('fileInput').files=files.files;$('fileInput').dispatchEvent(new w.Event('change',{bubbles:true}));await wait(()=>app.project!==previous&&!d.body.classList.contains('busy'));}
const assert=(ok,message)=>{if(!ok)throw Error(message);};
function change(id,value){$(id).value=value;$(id).dispatchEvent(new w.Event('change',{bubbles:true}));}
function key(index){d.querySelector(`#keyframes [data-index="${index}"]`).click();}
function row(index){d.querySelector(`[data-row="${index}"]`).click();}
let records=[];
async function check(id,title,test){try{await test();records.push({id,title,status:'PASS'});}catch(error){records.push({id,title,status:'FAIL',observed:error.message});}const r=records.at(-1),li=document.createElement('li');li.textContent=`${r.status} · ${id} · ${title}${r.observed?' — '+r.observed:''}`;li.style.color=r.status==='FAIL'?'#ff8fa7':'';results.append(li);}
async function audit(){
 await check('SC-001','Editing Hold keeps Preview on the selected key',async()=>{await fresh();row(8);key(3);change('holdTicks',3);assert(Math.abs(app.time-.25)<1e-9,`time=${app.time}, expected .25`);});
 await check('SC-002','Play starts from a selected final key',async()=>{await fresh();row(8);key(7);$('play').click();assert(Math.abs(app.time-7/12)<1e-9,`time=${app.time}, expected 7/12`);$('play').click();});
 await check('SC-003','Changing playback source keeps the current time',async()=>{await fresh();row(8);key(3);change('playbackMode','original');assert(Math.abs(app.time-.25)<1e-9,`time=${app.time}, expected .25`);});
 await check('SC-004','Unchanged input does not consume history or clear Redo',async()=>{await fresh();$('holdPlus').click();$('undo').click();const n=app.project.undoStack.length,r=app.project.redoStack.length;change('holdTicks',1);assert(app.project.undoStack.length===n&&app.project.redoStack.length===r,`undo=${app.project.undoStack.length}, redo=${app.project.redoStack.length}`);});
 await check('SC-005','Timeline and scrubber fit a 660 px high workspace',async()=>{await fresh();const bottom=$('scrubber').getBoundingClientRect().bottom;assert(bottom<=w.innerHeight,`scrubber bottom=${bottom}, viewport=${w.innerHeight}`);});
 await check('SC-006','Selecting a late key reveals its timeline button',async()=>{await fresh();row(10);key(12);const selected=d.querySelector('#keyframes .selected').getBoundingClientRect(),viewport=$('keyframes').getBoundingClientRect();assert(selected.left>=viewport.left-1&&selected.right<=viewport.right+1,`key right=${selected.right}, viewport right=${viewport.right}`);});
}
async function run(all){records=[];results.replaceChildren();status.textContent='Running…';await audit();if(all){
 await check('UX-001','Guide follows Import / Detect / Confirm / Merge / Export',async()=>{await fresh();assert($('workflowNext').dataset.action==='detect','No Detect guidance');$('workflowNext').click();await wait(()=>app.project.detection&&!d.body.classList.contains('busy'));assert($('workflowNext').dataset.action==='confirm','No Confirm guidance');$('workflowNext').click();assert($('workflowNext').dataset.action==='merge','No Merge guidance');$('workflowNext').click();await wait(()=>app.project.merged&&!d.body.classList.contains('busy'));assert($('workflowNext').dataset.action==='export','No Export guidance');});
 await check('UX-002','Duplicate groups can be browsed without editing the project',async()=>{const original=JSON.stringify(app.project.draft),history=app.project.undoStack.length;$('nextDuplicate').click();assert($('duplicateNavigator').dataset.group==='0','First group not selected');const first=Number($('sourceFrame').value);$('nextDuplicate').click();assert($('duplicateNavigator').dataset.group==='1'&&Number($('sourceFrame').value)!==first,'Next group failed');$('prevDuplicate').click();assert($('duplicateNavigator').dataset.group==='0','Previous group failed');assert(JSON.stringify(app.project.draft)===original&&app.project.undoStack.length===history&&app.project.merged,'Navigation changed document');});
 await check('UX-003','Hold and Move controls disable at valid boundaries',async()=>{await fresh();assert($('holdMinus').disabled&&$('moveLeft').disabled,'Lower bounds enabled');change('holdTicks',999);assert($('holdPlus').disabled,'Hold 999 can increment');key(11);assert($('moveRight').disabled,'Last key can move right');});
 await check('UX-004','Arrow tick navigation respects editable controls',async()=>{await fresh();$('play').focus();let e=new w.KeyboardEvent('keydown',{code:'ArrowRight',key:'ArrowRight',bubbles:true,cancelable:true});$('play').dispatchEvent(e);assert(e.defaultPrevented&&Math.abs(app.time-.1)<1e-9,'Arrow navigation failed');$('fps').focus();e=new w.KeyboardEvent('keydown',{code:'ArrowRight',key:'ArrowRight',bubbles:true,cancelable:true});$('fps').dispatchEvent(e);assert(!e.defaultPrevented,'Number input arrow stolen');});
 await check('UX-005','Paused compare preserves time when switching tabs',async()=>{await fresh();row(8);key(3);$('compareTab').click();assert(Math.abs(app.time-.25)<1e-9,'Compare reset time');$('sheetTab').click();assert(Math.abs(app.time-.25)<1e-9,'Sheet reset time');});
 await check('UX-006','Empty project has an actionable import guide',async()=>{const other=document.createElement('iframe');other.hidden=true;other.src='../index.html?ux-empty';document.body.append(other);await wait(()=>other.contentWindow.spriteCheck?.ready);const button=other.contentDocument.getElementById('workflowNext');assert(button.dataset.action==='import'&&!button.disabled,'Empty guide unavailable');other.remove();});
 await check('SC-007','Delete in numeric input does not remove a keyframe',async()=>{await fresh();key(2);const count=app.project.draft[0].keys.length;$('holdTicks').focus();const e=new w.KeyboardEvent('keydown',{code:'Delete',key:'Delete',bubbles:true,cancelable:true});$('holdTicks').dispatchEvent(e);assert(!e.defaultPrevented&&app.project.draft[0].keys.length===count,'Delete removed a key while editing a number');});
 await check('UX-007','A long edited timeline reveals the selected duplicate',async()=>{await fresh();row(10);key(12);for(let i=0;i<15;i++)$('duplicateKey').click();const selected=d.querySelector('#keyframes .selected').getBoundingClientRect(),viewport=$('keyframes').getBoundingClientRect();assert(selected.left>=viewport.left-1&&selected.right<=viewport.right+1,'Selected key is outside timeline');});
 await check('SC-008','DAT restores a removed source selection and Add Key uses that image',async()=>{await fresh();row(8);key(3);const source=Number($('sourceFrame').value);$('deleteKey').click();const cell=app.project.sheet.frames[source],canvas=$('sheetCanvas'),rect=canvas.getBoundingClientRect(),g=app.project.sheet.grid;canvas.dispatchEvent(new w.MouseEvent('click',{bubbles:true,clientX:rect.left+(cell.x+g.cellWidth/2)*rect.width/canvas.width,clientY:rect.top+(cell.y+g.cellHeight/2)*rect.height/canvas.height}));assert($('selectedLabel').textContent==='SOURCE FRAME','Removed source not selected');const preview=$('previewCanvas').toDataURL(),dat=await app.saveDAT();await fresh();const previous=app.project,files=new w.DataTransfer();files.items.add(new w.File([dat],'selected-source.dat',{type:'application/octet-stream'}));$('projectInput').files=files.files;$('projectInput').dispatchEvent(new w.Event('change',{bubbles:true}));await wait(()=>app.project!==previous&&!d.body.classList.contains('busy'));assert(Number($('sourceFrame').value)===source&&$('previewCanvas').toDataURL()===preview,'DAT lost the selected source or preview');$('addKey').click();assert(app.project.draft[8].keys.at(-1).sourceId===source,'Add Key restored a different image');});
 await check('UX-008','Live Preview stays visible while inspector controls scroll',async()=>{const controls=d.querySelector('.inspector-controls');controls.scrollTop=controls.scrollHeight;const preview=$('previewCanvas').getBoundingClientRect(),pane=d.querySelector('.inspector').getBoundingClientRect();assert(preview.top>=pane.top&&preview.bottom<=pane.bottom,'Inspector scrolling hid Live Preview');controls.scrollTop=0;});
}
 const failures=records.filter(r=>r.status==='FAIL');status.textContent=`${failures.length?'FAIL':'PASS'} ${records.length-failures.length} / ${records.length}`;document.getElementById('report').textContent=JSON.stringify(records,null,2);document.body.dataset.result=failures.length?'fail':'pass';}
document.getElementById('audit').onclick=()=>run(false);document.getElementById('run').onclick=()=>run(true);document.getElementById('hide').onclick=()=>results.hidden=!results.hidden;status.textContent='Ready';
</script>
