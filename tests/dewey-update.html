<!doctype html><meta charset="utf-8"><title>Dewey independent Update QA</title>
<style>body{background:#101521;color:#e5efe9;font:14px Consolas;margin:0}header{padding:8px;display:flex;gap:9px;flex-wrap:wrap}button{font:14px Consolas;padding:8px;background:#a5f1d0;border:0}iframe{display:block;width:1280px;height:760px;border:0}pre{white-space:pre-wrap;max-height:260px;overflow:auto}</style>
<header><button id="baseline">Reproduce request races</button><button id="run">Run independent Update QA</button><button id="pending">Prepare numeric input test</button><button id="available">Mock available</button><button id="measure">Measure native-request snapshot</button><button id="unlock">Mock current error / unlock</button><span id="status">Ready</span></header><iframe id="app" title="Owned mock-bridge Update workspace"></iframe><pre id="physical"></pre><pre id="report"></pre>
<script type="module">
import {decodeProject} from '../project-file.mjs';
import {APP_VERSION} from '../update.mjs';
const frame=document.getElementById('app'),status=document.getElementById('status'),report=document.getElementById('report'),physical=document.getElementById('physical');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function wait(fn){const until=performance.now()+15000;while(!fn()){if(performance.now()>until)throw Error('timeout');await sleep(20);}}
const fixture=new Uint8Array(await(await fetch('../assets/test-sheet.png')).arrayBuffer());
let w,d,$,app,serial=0,records=[],errors=[],installRequest=null;
const assert=(ok,message)=>{if(!ok)throw Error(message);},equal=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function lastRequest(){return Math.max(w.__packets.filter(p=>p.kind==='update-check'||p.kind==='update-install').at(-1)?.requestId??0,installRequest??0);}
function startInstall(){if(!$('updateInstall').disabled&& !$('updateInstall').hidden)installRequest=lastRequest()+1;$('updateInstall').click();}
function send(state,extra={}){for(const fn of w.__nativeListeners??[])fn({data:{kind:'update-state',requestId:lastRequest(),state,version:'99.0.0',...extra}});}
function menu(){ $('fileMenuButton').click();$('menuUpdate').click(); }
function change(id,value){$(id).value=value;$(id).dispatchEvent(new w.Event('change',{bubbles:true}));}
function bytes64(bytes){let text='';for(let i=0;i<bytes.length;i+=32768)text+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(text);}
function hashCanvas(id){const c=$(id),pixels=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let h=2166136261;for(const n of pixels)h=Math.imul(h^n,16777619);return {hash:h>>>0,width:c.width,height:c.height};}
function state(){return {request:lastRequest(),dialog:$('updateDialog').open,status:$('updateStatus').dataset.state,closeDisabled:$('updateClose').disabled,checkDisabled:$('updateCheck').disabled,installHidden:$('updateInstall').hidden,installs:w.__packets.filter(p=>p.kind==='update-install').length,playing:app.playing,time:app.time,history:app.project?{undo:app.project.undoStack.length,redo:app.project.redoStack.length}:null};}
async function fresh(){
 installRequest=null;const token=++serial;let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href)+'">');
 const boot=`<script>window.__qaSession=${token};window.__packets=[];window.__nativeListeners=[];window.spriteCheckDesktop={version:'${APP_VERSION}'};window.chrome??={};window.chrome.webview={postMessage:p=>__packets.push(p),addEventListener:(type,fn)=>__nativeListeners.push(fn)};window.__digestQueue=[];const originalDigest=crypto.subtle.digest.bind(crypto.subtle);crypto.subtle.digest=(...args)=>window.__failDigest?Promise.reject(Error('QA digest failure')):window.__holdDigest?new Promise((resolve,reject)=>__digestQueue.push(()=>originalDigest(...args).then(resolve,reject))):originalDigest(...args);window.__releaseDigests=()=>{window.__holdDigest=false;const q=__digestQueue.splice(0);q.forEach(fn=>fn());};<\/script>`;
 html=html.replace('<script type="module" src="app.mjs">',boot+'<script type="module" src="app.mjs">');frame.srcdoc=html;
 await wait(()=>frame.contentWindow?.__qaSession===token&&frame.contentWindow?.spriteCheck?.ready);w=frame.contentWindow;d=frame.contentDocument;$=id=>d.getElementById(id);app=w.spriteCheck;
 w.addEventListener('error',e=>errors.push(e.message));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
}
async function importPNG(){await app.openNativeFile('dewey-synthetic.png',bytes64(fixture));}
async function install(){const count=w.__packets.filter(p=>p.kind==='update-install').length;startInstall();await wait(()=>w.__packets.filter(p=>p.kind==='update-install').length>count);return w.__packets.filter(p=>p.kind==='update-install').at(-1);}
async function recover(packet){assert(typeof packet.session==='string','missing recovery DAT');return decodeProject(Uint8Array.from(atob(packet.session),c=>c.charCodeAt(0)));}
async function check(id,fn){try{records.push({id,status:'PASS',details:structuredClone(await fn())});}catch(e){records.push({id,status:'FAIL',observed:e.message,ui:app?state():null});}report.textContent=JSON.stringify({records,errors},null,2);}
async function raceChecks(){
 await check('SC-016 stale error cannot unlock a pending DAT save',async()=>{await fresh();await importPNG();menu();send('available');w.__holdDigest=true;const old=lastRequest();startInstall();const before=state();send('error',{requestId:old,message:'Late obsolete check'});const after=state();w.__releaseDigests();await wait(()=>w.__packets.some(p=>p.kind==='update-install'));send('error',{message:'QA cleanup'});assert(before.closeDisabled&&after.closeDisabled&&after.status==='saving',JSON.stringify({before,after}));return {before,after};});
 await check('SC-016 stale available cannot permit a duplicate install while downloading',async()=>{await fresh();await importPNG();menu();send('available');await install();send('available',{requestId:lastRequest()-1});const afterOld=state();startInstall();await sleep(120);const afterClick=state();send('error',{message:'QA cleanup'});assert(afterOld.closeDisabled&&afterOld.installHidden&&afterClick.installs===1,JSON.stringify({afterOld,afterClick}));return {afterOld,afterClick};});
}
document.getElementById('baseline').onclick=async()=>{records=[];errors=[];status.textContent='Running baseline';await raceChecks();status.textContent=`Baseline ${records.filter(r=>r.status==='PASS').length}/${records.length} PASS`;report.textContent=JSON.stringify({build:(await(await fetch('../package.json')).json()).version,bridge:'MOCK ONLY',records,errors},null,2);};
document.getElementById('run').onclick=async()=>{records=[];errors=[];status.textContent='Running';await raceChecks();
 await check('Current/error/check-close-reopen ignores old response and keeps plain notes',async()=>{await fresh();menu();const one=lastRequest();send('current',{version:'${APP_VERSION}',notes:'<img src=x onerror=alert(1)>'});assert($('updateInstall').hidden&&!$('updateNotes').querySelector('img'),'current/notes');$('updateCheck').click();const two=lastRequest();$('updateClose').click();menu();const three=lastRequest();send('available',{requestId:two});assert($('updateStatus').dataset.state==='checking','stale reopened response');send('error',{message:'offline'});assert(!$('updateCheck').disabled,'retry disabled');$('updateCheck').click();send('current');assert($('updateInstall').hidden,'current install visible');return {one,two,three,ui:state()};});
 await check('Empty workspace sends a null recovery once; duplicate click and close are locked',async()=>{await fresh();menu();send('available');startInstall();startInstall();await wait(()=>w.__packets.some(p=>p.kind==='update-install'));const packet=w.__packets.filter(p=>p.kind==='update-install');$('updateClose').click();const cancel=new w.Event('cancel',{cancelable:true});$('updateDialog').dispatchEvent(cancel);assert(packet.length===1&&packet[0].session===null,'empty snapshot/duplicate');assert(cancel.defaultPrevented&&$('updateDialog').open&&$('updateClose').disabled,'close unlocked');send('error',{message:'QA cleanup'});return {installs:packet.length,session:packet[0].session};});
 await check('Locked download accepts only matching numeric request IDs',async()=>{await fresh();menu();send('available');await install();const id=lastRequest(),trials=[];for(const bad of [id-1,id+1,String(id),null,undefined]){send('downloading',{percent:42});send('error',{requestId:bad,message:'obsolete'});trials.push({requestId:String(bad),ui:state()});}send('downloading',{percent:63});assert($('updateProgress').value===63,'matching progress ignored');send('error',{message:'real current error'});assert(!$('updateClose').disabled&&$('updateStatus').textContent==='real current error','matching error ignored');assert(trials.every(r=>r.ui.status==='downloading'&&r.ui.closeDisabled),JSON.stringify(trials));return trials;});
 await check('Snapshot failure never requests install and unlocks retry',async()=>{await fresh();await importPNG();menu();send('available');w.__failDigest=true;startInstall();await wait(()=>$('updateStatus').dataset.state==='error');assert(!w.__packets.some(p=>p.kind==='update-install'),'install after failed encoding');assert(!$('updateClose').disabled&&$('updateStatus').textContent.includes('QA digest failure'),'failed snapshot lock');w.__failDigest=false;return state();});
 await check('Dirty draft, old confirmation, removed source, Compare and original PNG survive mocked recovery',async()=>{
  await fresh();await importPNG();d.querySelector('[data-row="8"]').click();$('confirm').click();change('fps','17');change('holdTicks','7');$('loop').checked=false;$('loop').dispatchEvent(new w.Event('change',{bubbles:true}));d.querySelector('#keyframes [data-index="3"]').click();const source=app.project.draft[8].keys[3].sourceId;$('deleteKey').click();
  const c=$('sheetCanvas'),r=c.getBoundingClientRect(),f=app.project.sheet.frames[source];c.dispatchEvent(new w.MouseEvent('click',{clientX:r.left+(f.x+52)*r.width/c.width,clientY:r.top+(f.y+57)*r.height/c.height,bubbles:true}));$('compareTab').click();change('compareOriginalMode','sheet');$('compareLink').checked=false;$('compareLink').dispatchEvent(new w.Event('change',{bubbles:true}));$('compareMergedIn').click();$('exportName').value='dewey-dirty-recovery';if(!app.compare.log)$('compareLogToggle').click();
  const expected={draft:JSON.stringify(app.project.draft),confirmed:JSON.stringify(app.project.confirmed),compare:structuredClone(app.compare),time:app.time,history:app.project.undoStack.length};menu();send('available');const packet=await install(),restored=await recover(packet);
  assert(JSON.stringify(restored.project.draft)===expected.draft&&JSON.stringify(restored.project.confirmed)===expected.confirmed&&restored.project.dirty,'dirty/confirmation changed');assert(restored.view.selectedKey===-1&&restored.view.selectedSource===source,'removed source lost');assert(equal(restored.view.compare,expected.compare)&&restored.view.seconds===expected.time&&restored.view.tab==='compare','view changed');assert(restored.pngBytes.length===fixture.length&&restored.pngBytes.every((n,i)=>n===fixture[i]),'PNG changed');
  await fresh();await app.openNativeFile('recovery.dat',packet.session);assert(JSON.stringify(app.project.draft)===expected.draft&&app.project.undoStack.length===0,'reopen data/history');assert(!$('sheetSummary').textContent.includes('Open a PNG'),'stale footer');return {bytes:packet.session.length,source,hold:restored.project.draft[8].keys[0].ticks,fps:restored.project.draft[8].fps,loop:restored.project.draft[8].loop,undoBefore:expected.history,undoAfter:app.project.undoStack.length,footer:$('sheetSummary').textContent};
 });
 await check('Merged DAT recovery preserves merged RGBA, selected source, clock and visible pixels',async()=>{
  await fresh();await importPNG();d.querySelector('[data-row="8"]').click();change('holdTicks','4');change('fps','19');$('confirm').click();$('merge').click();await wait(()=>app.project.merged&&!d.body.classList.contains('busy'));$('compareTab').click();$('scrubber').value='4.5';$('scrubber').dispatchEvent(new w.Event('input',{bubbles:true}));const merged=app.project.merged.data.slice(),draft=JSON.stringify(app.project.draft),before={preview:hashCanvas('previewCanvas'),left:hashCanvas('compareOriginal'),right:hashCanvas('compareMerged'),time:app.time};
  menu();send('available');const packet=await install(),r=await recover(packet);assert(r.project.merged&&r.project.merged.data.every((n,i)=>n===merged[i]),'merged RGBA changed');assert(JSON.stringify(r.project.draft)===draft&&r.view.seconds===before.time,'timeline/time changed');await fresh();await app.openNativeFile('merged-recovery.dat',packet.session);await wait(()=>equal(hashCanvas('compareOriginal'),before.left)&&equal(hashCanvas('compareMerged'),before.right));assert(equal(hashCanvas('previewCanvas'),before.preview),'Preview pixels changed');assert(app.project.merged&&app.time===before.time&&!app.playing,'merged reopen state');return {before,after:{preview:hashCanvas('previewCanvas'),left:hashCanvas('compareOriginal'),right:hashCanvas('compareMerged'),time:app.time},footer:$('sheetSummary').textContent};
 });
 await check('Modal keyboard cannot alter animation/history while check/close remains usable',async()=>{const old={time:app.time,history:app.project.undoStack.length,draft:JSON.stringify(app.project.draft)};menu();send('available');for(const event of [{key:' ',code:'Space'},{key:'z',code:'KeyZ',ctrlKey:true},{key:'Delete',code:'Delete'},{key:'ArrowRight',code:'ArrowRight'}])$('updateCheck').dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,cancelable:true,...event}));assert(!app.playing&&app.time===old.time&&app.project.undoStack.length===old.history&&JSON.stringify(app.project.draft)===old.draft,'keyboard leaked');$('updateClose').click();return state();});
 await check('Closing while saving/download/install is blocked; current error unlocks and keeps data',async()=>{await fresh();await importPNG();menu();send('available');w.__holdDigest=true;startInstall();const phases=[];for(const phase of ['saving','downloading','installing']){if(phase==='downloading'){w.__releaseDigests();await wait(()=>w.__packets.some(p=>p.kind==='update-install'));}if(phase!=='saving')send(phase,{percent:68});$('updateClose').click();const event=new w.Event('cancel',{cancelable:true});$('updateDialog').dispatchEvent(event);phases.push({phase,prevented:event.defaultPrevented,ui:state()});}send('error',{message:'QA stop'});assert(phases.every(x=>x.prevented&&x.ui.dialog&&x.ui.closeDisabled),'closing not blocked');assert(!$('updateClose').disabled&&app.project.sheet.frames.length===116,'error lost project');return phases;});
 status.textContent=`${records.filter(r=>r.status==='PASS').length}/${records.length} PASS · errors ${errors.length}`;report.textContent=JSON.stringify({build:(await(await fetch('../package.json')).json()).version,bridge:'MOCK ONLY; no native download, install or restart',records,errors},null,2);
};
document.getElementById('pending').onclick=async()=>{await fresh();await importPNG();$('fps').focus();status.textContent='Pending numeric ready';};
document.getElementById('available').onclick=()=>send('available');document.getElementById('unlock').onclick=()=>send('error',{message:'QA current error'});
document.getElementById('measure').onclick=async()=>{const packet=w.__packets.filter(p=>p.kind==='update-install').at(-1),r=packet?.session?await recover(packet):null;physical.textContent=JSON.stringify({ui:state(),modelFPS:app.project?.draft[0].fps,modelHold:app.project?.draft[0].keys[0]?.ticks,recoveryFPS:r?.project.draft[0].fps,recoveryHold:r?.project.draft[0].keys[0]?.ticks,sessionNull:packet?.session===null,packets:w.__packets.map(p=>({kind:p.kind,requestId:p.requestId,sessionBytes:p.session?.length}))},null,2);};
</script>
