<!doctype html><meta charset="utf-8"><title>Dewey independent layout QA</title>
<style>body{margin:0;background:#101521;color:#d9ece3;font:14px Consolas}header{padding:8px;display:flex;gap:9px;flex-wrap:wrap}button{padding:8px;background:#a5f1d0;border:0;font:14px Consolas}iframe{display:block;width:1280px;height:680px;border:0}pre{max-height:280px;overflow:auto;white-space:pre-wrap}</style>
<header><button id="run">Run independent layout QA</button><button id="sample">Prepare physical test</button><button id="measure">Measure physical test</button><button id="reload">Reload owned app frame</button><button id="restore">Restore original browser preferences</button><span id="status">Loading</span></header><iframe id="app" src="../index.html?dewey-layout"></iframe><pre id="physical"></pre><pre id="report"></pre>
<script type="module">
const frame=document.getElementById('app'),status=document.getElementById('status'),report=document.getElementById('report'),physical=document.getElementById('physical'),KEY='sprite-check-layout-v1';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function wait(fn){const end=performance.now()+12000;while(!fn()){if(performance.now()>end)throw Error('timeout');await sleep(20);}}
await wait(()=>frame.contentWindow.spriteCheck?.ready);let w,d,app,records=[],errors=[],currentCase='startup';function bind(){w=frame.contentWindow;d=frame.contentDocument;app=w.spriteCheck;w.addEventListener('error',e=>errors.push({message:e.message,filename:e.filename,line:e.lineno,column:e.colno,stack:e.error?.stack??null,time:performance.now(),context:currentCase}));}bind();
const savedOriginal='dewey-layout-original-pref';if(sessionStorage.getItem(savedOriginal)===null)sessionStorage.setItem(savedOriginal,JSON.stringify(w.localStorage.getItem(KEY)));const originalStorage=JSON.parse(sessionStorage.getItem(savedOriginal)),$=id=>d.getElementById(id),assert=(v,m)=>{if(!v)throw Error(m);};
const settle=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(r,50))));
function key(id,value,shiftKey=false){$(id).dispatchEvent(new w.KeyboardEvent('keydown',{key:value,code:value,shiftKey,bubbles:true,cancelable:true}));}
function visible(el){const s=w.getComputedStyle(el);return el.getClientRects().length&&s.visibility!=='hidden'&&s.display!=='none';}
function fonts(){const bad=[],all=[];for(const el of d.querySelectorAll('body *')){if(!visible(el))continue;if(![...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim())&&!el.matches('input,button,select'))continue;const size=parseFloat(w.getComputedStyle(el).fontSize);all.push(size);if(size<12)bad.push({id:el.id,tag:el.tagName,size});}return {minimum:Math.min(...all),count:all.length,bad};}
function rect(el){const r=el.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom};}
function geometry(){return {window:{width:w.innerWidth,height:w.innerHeight},scrollWidth:d.documentElement.scrollWidth,scrollHeight:d.documentElement.scrollHeight,editor:rect(d.querySelector('.editor')),sheet:rect($('sheetViewport')),scrub:rect($('scrubber')),handles:Object.fromEntries(['sidebar','inspector','preview','timeline'].map(name=>[name,rect($(name+'Divider'))]))};}
function clipped(){const found=[];for(const el of d.querySelectorAll('button,.row-name,#previewName,.field-label,.section-heading')){if(!visible(el))continue;const r=rect(el);if(r.width>0&&el.scrollWidth>el.clientWidth+3)found.push({id:el.id,class:el.className,text:el.textContent.trim().slice(0,70),width:r.width,scrollWidth:el.scrollWidth,clientWidth:el.clientWidth});}return found;}
const snapshot=()=>({layout:app.layout,geometry:geometry(),fonts:fonts(),clipped:clipped(),history:{undo:app.project?.undoStack.length,redo:app.project?.redoStack.length},time:app.time,playing:app.playing,errors:structuredClone(errors),draft:JSON.stringify(app.project?.draft)});
async function resize(width,height){frame.style.width=width+'px';frame.style.height=height+'px';await settle();}
async function fresh(){const png=await(await fetch('../assets/test-sheet.png')).arrayBuffer(),before=app.project,dt=new w.DataTransfer();dt.items.add(new w.File([png],'นักรบ_SkeletonSword_very-long-product-and-animation-file-name-for-truncation-check.png',{type:'image/png'}));$('fileInput').files=dt.files;$('fileInput').dispatchEvent(new w.Event('change',{bubbles:true}));await wait(()=>app.project!==before&&!d.body.classList.contains('busy'));$('resetLayout').click();await settle();}
async function reloadOwnedFrame(){const loaded=new Promise(r=>frame.addEventListener('load',r,{once:true}));frame.src='../index.html?dewey-layout-reload='+Date.now();await Promise.race([loaded,sleep(12000).then(()=>{throw Error('iframe reload load-event timeout');})]);await wait(()=>frame.contentWindow.spriteCheck?.ready);bind();await settle();}
async function check(id,fn){currentCase=id;try{records.push({id,status:'PASS',details:structuredClone(await fn())});}catch(e){records.push({id,status:'FAIL',observed:e.message,state:snapshot()});}report.textContent=JSON.stringify({records,errors},null,2);}
function assertData(before){assert(JSON.stringify(app.project?.draft)===before.draft,'draft changed');assert(app.project?.undoStack.length===before.history.undo&&app.project?.redoStack.length===before.history.redo,'history changed');assert(app.time===before.time,'paused clock changed');}
document.getElementById('run').onclick=async()=>{records=[];errors=[];status.textContent='Running';await resize(1280,680);await fresh();
 await check('all desktop boundary sizes/fonts/text overflow',async()=>{const samples=[];for(const [width,height] of [[981,660],[1024,600],[1280,660],[1280,680],[1440,940],[1920,1080]]){await resize(width,height);$('resetLayout').click();await settle();const f=fonts(),g=geometry(),cut=clipped();samples.push({width,height,font:f.minimum,cut,geometry:g});assert(f.bad.length===0,'fonts '+JSON.stringify(f.bad));assert(g.scrollWidth<=width+1,`document overflow ${width}: ${g.scrollWidth}`);assert(g.editor.width>=298,'center narrower than300');assert(g.scrub.bottom<=Math.max(height,660),`scrubber clipped at ${width}x${height}: ${g.scrub.bottom}`);}return samples;});
 await check('desktop splitter End/Home keeps usable viewport and bounds',async()=>{await resize(1280,680);const before=snapshot();for(const name of ['sidebar','inspector','timeline','preview']){key(name+'Divider','End');await settle();const state=app.layout;assert(state.sizes[name]===state.limits[name][1],name+' End');assert(d.querySelector('.editor').clientWidth>=298,'center collapsed');key(name+'Divider','Home');await settle();assert(app.layout.sizes[name]===app.layout.limits[name][0],name+' Home');}assertData(before);return snapshot();});
 await check('Shift increments and irrelevant keyboard keys isolate animation',async()=>{await resize(1440,940);$('resetLayout').click();await settle();const before=snapshot();for(const [name,arrow,sign] of [['sidebar','ArrowRight',1],['inspector','ArrowLeft',1],['timeline','ArrowUp',1],['preview','ArrowDown',1]]){key(name+'Divider','Home');const start=app.layout.sizes[name];key(name+'Divider',arrow,true);await settle();assert(app.layout.sizes[name]===Math.min(app.layout.limits[name][1],start+40),name+' Shift40');for(const value of [' ','Delete','z','y'])$(name+'Divider').dispatchEvent(new w.KeyboardEvent('keydown',{key:value,code:value===' '?'Space':value==='z'?'KeyZ':value==='y'?'KeyY':value,ctrlKey:value==='z'||value==='y',bubbles:true,cancelable:true}));}assert(!app.playing,'separator Space played');assertData(before);return app.layout;});
 await check('double click resets one preference only; global reset clears all',async()=>{const before=snapshot();const prior=app.layout.preferences;$('sidebarDivider').dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true}));await settle();assert(app.layout.preferences.sidebar===246,'sidebar default');for(const name of ['inspector','timeline','preview'])assert(app.layout.preferences[name]===prior[name],name+' unexpectedly reset');$('resetLayout').click();await settle();assert(JSON.stringify(app.layout.preferences)===JSON.stringify({sidebar:246,inspector:320,timeline:190,preview:220}),'global defaults');assertData(before);return app.layout;});
 await check('constraints restore remembered preferences across desktop/compact expansion',async()=>{await resize(1920,1080);for(const name of ['sidebar','inspector','timeline','preview'])key(name+'Divider','End');await settle();const prefs=app.layout.preferences;const rows=[];for(const size of [[981,660],[980,660],[620,820],[760,820],[1920,1080]]){await resize(...size);rows.push({size,state:app.layout});assert(JSON.stringify(app.layout.preferences)===JSON.stringify(prefs),'constraint rewrote prefs');if(size[0]<=980)for(const el of d.querySelectorAll('[data-resize]'))assert(el.tabIndex===-1&&!visible(el),'compact handle interactive');}assert(app.layout.sizes.sidebar===prefs.sidebar&&app.layout.sizes.inspector===prefs.inspector&&app.layout.sizes.timeline===prefs.timeline,'expanded preference lost');return rows;});
 await check('compact text/font/overflow at breakpoints and narrow page',async()=>{const samples=[];for(const width of [980,760,621,620,480,375]){await resize(width,820);const f=fonts(),g=geometry(),cut=clipped();samples.push({width,minimum:f.minimum,geometry:g,cut});assert(f.bad.length===0,'sub12 compact');assert(g.scrollWidth<=width+1,`${width}px overflow -> ${g.scrollWidth}`);}return samples;});
 await check('Grid/Help/Export modal text >=12 and accessible inside viewport',async()=>{await resize(1024,660);$('resetLayout').click();$('confirm').click();$('merge').click();await wait(()=>app.project.merged&&!d.body.classList.contains('busy'));const samples=[];for(const [button,dialog] of [['openGrid','gridDialog'],['help','helpDialog'],['export','exportDialog']]){$(button).click();await settle();const g=rect($(dialog)),f=fonts();samples.push({dialog,geometry:g,fonts:f,clipped:clipped()});assert(f.bad.length===0,dialog+' sub12');assert(g.x>=0&&g.y>=0&&g.right<=w.innerWidth+1&&g.bottom<=w.innerHeight+1,dialog+' outside viewport');$(dialog).close();}return samples;});
 await check('long filename is bounded and full name remains available',()=>{const el=$('filename');assert(el.title===el.textContent,'full filename lost');assert(rect(el).right<=1280,'filename grows past window');return {title:el.title,geometry:rect(el)};});
 await check('Compare canvas redraw and toolbar after constraint changes',async()=>{$('compareTab').click();for(const [width,height] of [[1440,940],[981,660],[760,820],[1280,680]]){await resize(width,height);assert(!visible(d.querySelector('.canvas-toolbar')),'Sheet toolbar in Compare');for(const side of ['Original','Merged']){const canvas=$('compare'+side);assert(canvas.width>0&&canvas.height>0,side+' canvas empty');}}$('sheetTab').click();assert(visible(d.querySelector('.canvas-toolbar')),'Sheet toolbar missing');return snapshot();});
 await check('stored preferences match layout UI before independent browser reload',async()=>{await resize(1440,940);$('resetLayout').click();for(const name of ['sidebar','inspector','timeline','preview'])key(name+'Divider',name==='sidebar'?'ArrowRight':name==='inspector'?'ArrowLeft':name==='preview'?'ArrowDown':'ArrowUp',true);await settle();const prefs=app.layout.preferences;const stored=JSON.parse(w.localStorage.getItem(KEY));for(const name of Object.keys(prefs))assert(stored[name]===prefs[name],'stored preference mismatch '+name);return {before:prefs,stored};});
 status.textContent=`${records.filter(r=>r.status==='PASS').length}/${records.length} PASS; errors ${errors.length}`;report.textContent=JSON.stringify({build:(await(await fetch('../package.json')).json()).version,records,errors},null,2);
};
document.getElementById('sample').onclick=async()=>{await resize(1280,760);await fresh();errors=[];currentCase='physical';status.textContent='Physical test ready';};
document.getElementById('measure').onclick=()=>{physical.textContent=JSON.stringify(snapshot(),null,2);};
document.getElementById('reload').onclick=async()=>{await reloadOwnedFrame();physical.textContent=JSON.stringify(snapshot(),null,2);};
document.getElementById('restore').onclick=()=>{if(originalStorage===null)w.localStorage.removeItem(KEY);else w.localStorage.setItem(KEY,originalStorage);sessionStorage.removeItem(savedOriginal);status.textContent='Original browser preferences restored';};
status.textContent='Ready';
</script>
