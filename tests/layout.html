<!doctype html><meta charset="utf-8"><title>Sprite Check readable layout tests</title>
<style>body{margin:0;background:#0b101b;color:#dcece6;font:14px Consolas,monospace}header{display:flex;flex-wrap:wrap;gap:8px;padding:8px}button{padding:8px;font:14px Consolas;background:#a5f1d0;border:0;cursor:pointer}iframe{display:block;width:1280px;height:680px;border:0}#report{max-height:200px;overflow:auto;white-space:pre-wrap;padding:10px}#status{padding:8px}</style>
<header><button id="run">Run layout tests</button><button id="sample">Load sample / reset layout</button><button id="large">1440 × 940</button><button id="compact">1280 × 680</button><button id="small">760 × 820</button><button id="remember">Remember current sizes</button><button id="reload">Reload / verify remembered sizes</button><button id="measure">Measure manual changes</button><span id="status">Loading…</span></header><iframe id="app" src="../index.html?layout-test" title="Resizable workspace"></iframe><pre id="report"></pre>
<script type="module">
const frame=document.getElementById('app'),status=document.getElementById('status'),report=document.getElementById('report');
const wait=async fn=>{const end=performance.now()+12000;while(!fn()){if(performance.now()>end)throw Error('Timed out');await new Promise(r=>setTimeout(r,20));}};
await wait(()=>frame.contentWindow.spriteCheck?.ready);
let w,d,app,records=[],remembered;function bind(){w=frame.contentWindow;d=frame.contentDocument;app=w.spriteCheck;}bind();
const $=id=>d.getElementById(id),assert=(ok,message)=>{if(!ok)throw Error(message);};
const settle=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(r,40))));
async function fresh(){const png=await(await fetch('../assets/test-sheet.png')).arrayBuffer(),previous=app.project,files=new w.DataTransfer();files.items.add(new w.File([png],'layout-sample.png',{type:'image/png'}));$('fileInput').files=files.files;$('fileInput').dispatchEvent(new w.Event('change',{bubbles:true}));await wait(()=>app.project!==previous&&!d.body.classList.contains('busy'));$('resetLayout').click();await settle();}
function key(id,key,shiftKey=false){$(id).focus();$(id).dispatchEvent(new w.KeyboardEvent('keydown',{key,code:key,bubbles:true,cancelable:true,shiftKey}));}
function visible(el){return !!el.getClientRects().length&&w.getComputedStyle(el).visibility!=='hidden';}
function fontAudit(){const bad=[],sizes=[];for(const el of d.querySelectorAll('body *')){if(!visible(el))continue;const text=[...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim())||el.matches('input,select,button');if(!text)continue;const size=parseFloat(w.getComputedStyle(el).fontSize);sizes.push(size);if(size<12)bad.push(`${el.id||el.className||el.tagName}: ${size}`);}return {minimum:Math.min(...sizes),bad,count:sizes.length};}
function geometry(){return Object.fromEntries(['sheetViewport','previewCanvas','keyframes','scrubber','sidebarDivider','inspectorDivider','previewDivider','timelineDivider'].map(id=>{const r=$(id).getBoundingClientRect();return[id,{x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom}];}));}
async function check(id,title,test){try{await test();records.push({id,title,status:'PASS'});}catch(error){records.push({id,title,status:'FAIL',observed:error.message});}report.textContent=JSON.stringify(records,null,2);}
document.getElementById('run').onclick=async()=>{records=[];status.textContent='Running…';frame.style.width='1280px';frame.style.height='680px';await settle();
 await check('LAY-001','All visible empty-workspace text is at least 12 px',()=>assert(fontAudit().bad.length===0,JSON.stringify(fontAudit())));
 await check('LAY-002','Imported sheet text, inputs and Timeline fit the compact window',async()=>{await fresh();assert(fontAudit().bad.length===0,JSON.stringify(fontAudit()));assert($('scrubber').getBoundingClientRect().bottom<=680,'Scrubber below viewport');assert(d.documentElement.scrollWidth<=1280,'Horizontal page overflow');});
 await check('LAY-003','Keyboard resizes all four handles without changing timing or Undo',async()=>{const draft=JSON.stringify(app.project.draft),history=app.project.undoStack.length,time=app.time;for(const [id,name,arrow] of [['sidebarDivider','sidebar','ArrowRight'],['inspectorDivider','inspector','ArrowLeft'],['timelineDivider','timeline','ArrowUp'],['previewDivider','preview','ArrowUp']]){const before=app.layout.sizes[name];key(id,arrow);await settle();assert(app.layout.sizes[name]!==before,`${name} did not resize`);}assert(JSON.stringify(app.project.draft)===draft&&app.project.undoStack.length===history&&app.time===time,'Layout changed animation data');});
 await check('LAY-004','Home / End clamp panel widths and keep a usable center viewport',async()=>{key('sidebarDivider','End');key('inspectorDivider','End');await settle();assert(d.querySelector('.editor').clientWidth>=298,'Center collapsed');assert(app.layout.sizes.inspector<=app.layout.limits.inspector[1],'Inspector beyond boundary');key('sidebarDivider','Home');assert(app.layout.sizes.sidebar===200,'Home did not reach minimum');$('resetLayout').click();await settle();});
 await check('LAY-005','Compare redraws after resizing and its removed Sheet toolbar stays hidden',async()=>{$('compareTab').click();key('inspectorDivider','ArrowLeft',true);await settle();assert(!visible(d.querySelector('.canvas-toolbar')),'Sheet toolbar returned in Compare');assert($('compareOriginal').width>0&&$('compareOriginal').height>0,'Compare canvas empty');assert(fontAudit().bad.length===0,JSON.stringify(fontAudit()));$('play').click();await new Promise(r=>setTimeout(r,200));assert(app.time>0&&app.playing,'Compare playback failed');$('play').click();const time=app.time;$('sheetTab').click();assert(app.time===time&&visible(d.querySelector('.canvas-toolbar')),'Tab switch reset time or hid tools');});
 await check('LAY-006','Modal labels and controls remain at least 12 px',()=>{$('openGrid').click();assert(fontAudit().bad.length===0,JSON.stringify(fontAudit()));$('gridDialog').close();$('help').click();assert(fontAudit().bad.length===0,JSON.stringify(fontAudit()));$('helpDialog').close();});
 await check('LAY-007','Short window clamps panels and enlarging restores preferences',async()=>{frame.style.height='940px';await settle();key('timelineDivider','End');key('previewDivider','End');await settle();const prefs=app.layout.preferences;frame.style.height='680px';await settle();assert(app.layout.sizes.timeline< prefs.timeline,'Short window did not clamp');assert(app.layout.preferences.timeline===prefs.timeline,'Clamping erased preference');frame.style.height='940px';await settle();assert(app.layout.sizes.timeline===prefs.timeline,'Large window did not restore timeline');});
 await check('LAY-008','Narrow layout has readable text and no horizontal page overflow',async()=>{frame.style.width='760px';await settle();assert(fontAudit().bad.length===0,JSON.stringify(fontAudit()));assert(d.documentElement.scrollWidth<=760,'Narrow layout overflows');assert(app.layout.compact&&$('sidebarDivider').tabIndex===-1,'Hidden separator still in tab order');});
 frame.style.width='1280px';frame.style.height='680px';await settle();$('resetLayout').click();await settle();status.textContent=`${records.some(r=>r.status==='FAIL')?'FAIL':'PASS'} ${records.filter(r=>r.status==='PASS').length}/${records.length}`;document.body.dataset.result=records.some(r=>r.status==='FAIL')?'fail':'pass';};
document.getElementById('sample').onclick=()=>fresh().then(()=>status.textContent='Sample ready');
for(const [id,width,height] of [['large',1440,940],['compact',1280,680],['small',760,820]])document.getElementById(id).onclick=()=>{frame.style.width=`${width}px`;frame.style.height=`${height}px`;status.textContent=`${width} × ${height}`;};
document.getElementById('remember').onclick=()=>{remembered=app.layout.preferences;status.textContent='Remembered '+JSON.stringify(remembered);};
document.getElementById('reload').onclick=async()=>{frame.contentWindow.location.reload();await new Promise(r=>frame.addEventListener('load',r,{once:true}));await wait(()=>frame.contentWindow.spriteCheck?.ready);bind();const ok=JSON.stringify(remembered)===JSON.stringify(app.layout.preferences);status.textContent=ok?'PASS preferences survived reload':'FAIL preference mismatch';report.textContent=JSON.stringify({remembered,restored:app.layout.preferences},null,2);};
document.getElementById('measure').onclick=()=>{report.textContent=JSON.stringify({layout:app.layout,font:fontAudit(),geometry:geometry(),history:app.project?.undoStack.length,time:app.time},null,2);status.textContent='Measured';};
status.textContent='Ready';
</script>
