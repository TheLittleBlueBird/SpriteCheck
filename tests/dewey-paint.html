<!doctype html><meta charset="utf-8"><title>Dewey independent Pixel Paint QA</title>
<style>body{background:#101521;color:#e5efe9;font:14px Consolas;margin:0}header{padding:8px;display:flex;gap:9px}button{font:14px Consolas;padding:8px;background:#a5f1d0;border:0}iframe{display:block;width:1280px;height:800px;border:0}pre{white-space:pre-wrap;max-height:320px;overflow:auto}</style>
<header><button id="run">Run independent Paint QA</button><button id="physical">Prepare real input</button><button id="measure">Measure real input</button><span id="status">Ready</span></header><iframe id="app" title="Owned Paint workspace; mock native save bridge"></iframe><pre id="report"></pre>
<script type="module">
import {encodePNG,decodePNG} from '../png.mjs';
import {decodeProject} from '../project-file.mjs';
const frame=document.getElementById('app'),status=document.getElementById('status'),report=document.getElementById('report');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function wait(fn){const end=performance.now()+15000;while(!fn()){if(performance.now()>end)throw Error('timeout');await sleep(20);}}
const data=new Uint8ClampedArray(16*16*4);for(let ry=0;ry<2;ry++)for(let cx=0;cx<2;cx++){for(let y=2;y<6;y++)for(let x=2;x<6;x++)data.set([40+ry*60,60,80,255],((ry*8+y)*16+cx*8+x)*4);data.set([255,0,255,255],((ry*8)*16+cx*8)*4);}const fixture=await encodePNG({width:16,height:16,data});
let w,d,$,app,serial=0,records=[],errors=[],physicalBefore=null;
const assert=(ok,message)=>{if(!ok)throw Error(message);},eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b),copy=a=>Array.from(a),px=(f,x,y)=>copy(f.data.subarray((y*8+x)*4,(y*8+x)*4+4));
function bytes64(bytes){let s='';for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(s);}
function decode64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
function change(id,value){$(id).value=value;$(id).dispatchEvent(new w.Event('change',{bubbles:true}));}
function hashCanvas(id){const c=$(id),p=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let h=2166136261;for(const n of p)h=Math.imul(h^n,16777619);return {hash:h>>>0,width:c.width,height:c.height};}
function paint(){ $('paintTab').click();assert(!app.paint.root.hidden,'Paint not open'); }
function captureStub(){const c=$('paintCanvas');c.setPointerCapture=()=>{};c.hasPointerCapture=()=>false;c.releasePointerCapture=()=>{};}
function pointer(type,x,y,extra={}){const p=app.paint,g=p.geometry,r=p.canvas.getBoundingClientRect();p.canvas.dispatchEvent(new w.PointerEvent(type,{pointerId:7,button:0,buttons:type==='pointerup'?0:1,clientX:r.left+g.x+(x+.5)*g.scale,clientY:r.top+g.y+(y+.5)*g.scale,bubbles:true,cancelable:true,...extra}));}
function stroke(x1,y1,x2=x1,y2=y1,extra={}){pointer('pointerdown',x1,y1,extra);if(x1!==x2||y1!==y2)pointer('pointermove',x2,y2,extra);pointer('pointerup',x2,y2,extra);}
function key(target,code,extra={}){const k=code==='Space'?' ':code==='Escape'?'Escape':code==='Delete'?'Delete':code.startsWith('Key')?code.slice(3).toLowerCase():code;target.dispatchEvent(new w.KeyboardEvent('keydown',{code,key:k,bubbles:true,cancelable:true,...extra}));}
function summary(){return {frames:app.project?.sheet.frames.length,history:app.project?.undoStack.length,redo:app.project?.redoStack.length,dirty:app.project?.dirty,time:app.time,playing:app.playing,source:app.paint.sourceId};}
async function fresh(load=true){const token=++serial;let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href)+'">');const boot=`<script>window.__qaSession=${token};window.__packets=[];window.spriteCheckDesktop={version:'1.7.0'};window.chrome??={};window.chrome.webview={postMessage:p=>__packets.push(p),addEventListener:()=>{}};<\/script>`;html=html.replace('<script type="module" src="app.mjs">',boot+'<script type="module" src="app.mjs">');frame.srcdoc=html;await wait(()=>frame.contentWindow?.__qaSession===token&&frame.contentWindow?.spriteCheck?.ready);w=frame.contentWindow;d=frame.contentDocument;$=id=>d.getElementById(id);app=w.spriteCheck;w.addEventListener('error',e=>errors.push(e.message));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));if(load){await app.openNativeFile('dewey-16x16.png',bytes64(fixture));$('openGrid').click();change('cellWidth','8');change('cellHeight','8');$('gridForm').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));assert(app.project.sheet.frames.length===4,'synthetic grid');paint();captureStub();}}
async function check(name,fn){try{records.push({name,status:'PASS',details:structuredClone(await fn())});}catch(error){records.push({name,status:'FAIL',observed:error.message,ui:app?summary():null});}report.textContent=JSON.stringify({records,errors},null,2);}
document.getElementById('run').onclick=async()=>{records=[];errors=[];status.textContent='Running independent QA';
await check('Startup empty disables Paint and its edit controls',async()=>{await fresh(false);assert($('paintTab').disabled&&!app.project,'startup');for(const id of ['paintSize','paintColor','paintAlpha','paintHex','paintFrameSelect','paintResetFrame','paintUndo','paintRedo','paintExport'])assert($(id).disabled,id+' enabled');return {empty:$('sheetSummary').textContent};});
await check('Paint frame mapping by selector, neighbors and Sheet selection',async()=>{await fresh();change('paintFrameSelect','3');assert(app.paint.sourceId===3&&$('paintFrameInfo').textContent.includes('R2 C2'),'selector mapping');$('paintPrevious').click();assert(app.paint.sourceId===2,'previous');$('paintNext').click();assert(app.paint.sourceId===3,'next');$('sheetTab').click();const c=$('sheetCanvas'),r=c.getBoundingClientRect();c.dispatchEvent(new w.MouseEvent('click',{clientX:r.left+4*r.width/16,clientY:r.top+4*r.height/16,bubbles:true}));paint();assert(app.paint.sourceId===0,'Sheet selection did not map');return summary();});
await check('Continuous Pencil writes exact RGBA and one Undo; sibling duplicate preserved',async()=>{await fresh();const before=app.project.sheet.frames[0].data.slice(),other=app.project.sheet.frames[1].data.slice();change('paintHex','#12345680');stroke(1,1,6,1);assert(eq(px(app.project.sheet.frames[0],3,1),[18,52,86,128]),'RGBA differs');assert(app.project.undoStack.length===1,'stroke not one history');assert(app.project.sheet.frames[1].data.every((n,i)=>n===other[i]),'duplicate sibling changed');$('paintUndo').click();assert(app.project.sheet.frames[0].data.every((n,i)=>n===before[i]),'undo pixels differs');$('paintRedo').click();assert(eq(px(app.project.sheet.frames[0],3,1),[18,52,86,128]),'redo differs');return summary();});
await check('Eraser and right mouse erase to transparent RGBA',async()=>{await fresh();$('paintTool-eraser').click();stroke(0,0);assert(eq(px(app.project.sheet.frames[0],0,0),[0,0,0,0]),'eraser');$('paintTool-pencil').click();stroke(2,2,2,2,{button:2});assert(eq(px(app.project.sheet.frames[0],2,2),[0,0,0,0]),'right click');return summary();});
await check('Fill bounded contiguous region; Line preview replaces temporary trail',async()=>{await fresh();change('paintHex','#EEDDCCFF');$('paintTool-fill').click();stroke(3,3);assert(eq(px(app.project.sheet.frames[0],5,5),[238,221,204,255])&&eq(px(app.project.sheet.frames[0],0,0),[255,0,255,255]),'fill boundary');$('paintTool-line').click();change('paintHex','#AA3322FF');pointer('pointerdown',1,6);pointer('pointermove',6,6);pointer('pointermove',1,1);pointer('pointerup',1,1);assert(eq(px(app.project.sheet.frames[0],1,4),[170,51,34,255]),'line final');assert(eq(px(app.project.sheet.frames[0],5,6),[0,0,0,0]),'temporary line persisted');assert(app.project.undoStack.length===2,'fill+line history');return summary();});
await check('Eyedropper, Alt pick, alpha control and frame palette preserve exact RGBA',async()=>{await fresh();change('paintHex','#11223344');stroke(1,1);$('paintTool-eyedropper').click();stroke(1,1);assert($('paintHex').value==='#11223344','eyedropper');$('paintTool-pencil').click();stroke(0,0,0,0,{altKey:true});assert($('paintHex').value==='#FF00FFFF','Alt picker');change('paintAlpha','12');assert($('paintHex').value==='#FF00FF0C','alpha');const sw=d.querySelector('#paintPalette [aria-label="#11223344"]');assert(sw,'palette missing exact alpha');sw.click();assert($('paintHex').value==='#11223344','palette');return {color:app.paint.color,history:app.project.undoStack.length};});
await check('Brush size edge clip and zero-change stroke do not overflow or grow history',async()=>{await fresh();change('paintSize','3');change('paintHex','#010203FF');stroke(0,0);assert(eq(px(app.project.sheet.frames[0],1,1),[1,2,3,255]),'brush clip');assert(eq(px(app.project.sheet.frames[1],0,0),[255,0,255,255]),'brush touched sibling');const h=app.project.undoStack.length;stroke(0,0);assert(app.project.undoStack.length===h,'no-op history');return summary();});
await check('Escape, pointercancel and lostcapture discard preview and keep history',async()=>{await fresh();const before=app.project.sheet.frames[0].data.slice();const cases=[];for(const t of ['Escape','pointercancel','lostpointercapture']){pointer('pointerdown',7,7);pointer('pointermove',7,2);assert(app.paint.painting,'missing preview');if(t==='Escape')key($('paintCanvas'),'Escape');else pointer(t,7,2);cases.push({cancel:t,painting:app.paint.painting,history:app.project.undoStack.length});assert(!app.paint.painting&&app.project.undoStack.length===0&&app.project.sheet.frames[0].data.every((n,i)=>n===before[i]),t);}return cases;});
await check('Switching frame and Sheet/Compare cancels unfinished stroke',async()=>{await fresh();pointer('pointerdown',7,7);change('paintFrameSelect','1');assert(!app.paint.painting&&!app.project.undoStack.length,'frame switch committed');pointer('pointerdown',7,7);$('sheetTab').click();assert(!app.paint.painting&&!app.project.undoStack.length,'Sheet switch committed');paint();pointer('pointerdown',7,7);$('compareTab').click();assert(!app.paint.painting&&!app.project.undoStack.length,'Compare switch committed');return summary();});
await check('Original Read Only prevents edits and exposes original pixels after paint',async()=>{await fresh();change('paintHex','#102030FF');stroke(0,0);const edited=app.project.sheet.frames[0].data.slice(),h=app.project.undoStack.length;$('paintOriginal').checked=true;$('paintOriginal').dispatchEvent(new w.Event('change'));stroke(0,0);assert(app.project.undoStack.length===h&&app.project.sheet.frames[0].data.every((n,i)=>n===edited[i]),'readonly changed');assert(eq(copy(app.paint.bitmap.getContext('2d').getImageData(0,0,1,1).data),[255,0,255,255]),'original displayed wrong');return summary();});
await check('Reset Frame is undoable and no-op reset stays disabled',async()=>{await fresh();assert($('paintResetFrame').disabled,'initial reset enabled');stroke(7,7);assert(!$('paintResetFrame').disabled,'reset disabled');$('paintResetFrame').click();assert(!app.project.hasPixelEdits&&$('paintResetFrame').disabled,'reset not baseline');$('paintUndo').click();assert(app.project.hasPixelEdits,'reset undo failed');return summary();});
await check('Mixed timeline and pixel history enforces last 50 edits with branch reset',async()=>{await fresh();for(let i=0;i<60;i++){if(i%2===0){change('paintHex','#'+(i+1).toString(16).padStart(6,'0')+'FF');stroke(7,7);}else change('holdTicks',String(i+2));}assert(app.project.undoStack.length===50,'history limit');const final={pixels:copy(app.project.sheet.frames[0].data),draft:JSON.stringify(app.project.draft)};for(let i=0;i<50;i++)$('paintUndo').click();assert(app.project.undoStack.length===0&&app.project.redoStack.length===50,'undo range');for(let i=0;i<50;i++)$('paintRedo').click();assert(eq(copy(app.project.sheet.frames[0].data),final.pixels)&&JSON.stringify(app.project.draft)===final.draft,'redo mixed exactness');$('paintUndo').click();change('paintHex','#FF0000FF');stroke(7,6);assert(app.project.redoStack.length===0,'branch redo retained');return summary();});
await check('Compare Original left retains baseline while edited right changes pixels',async()=>{await fresh();$('compareTab').click();const before={left:hashCanvas('compareOriginal'),right:hashCanvas('compareMerged')};paint();change('paintHex','#00FFFFFF');stroke(0,0);$('compareTab').click();const after={left:hashCanvas('compareOriginal'),right:hashCanvas('compareMerged')};assert(eq(before.left,after.left),'Original changed');assert(!eq(before.right,after.right),'Edited pixels not changed');return {before,after};});
await check('DAT v2 reopens Paint with separate original and working PNG, selection and timeline',async()=>{await fresh();change('paintFrameSelect','3');change('paintHex','#10203080');stroke(7,7);change('holdTicks','6');const working=app.project.sheet.image.data.slice(),draft=JSON.stringify(app.project.draft),dat=await app.saveDAT(),decoded=await decodeProject(dat);assert(new DataView(dat.buffer).getUint32(16,true)===2,'DAT not v2');assert(decoded.pngBytes.length===fixture.length&&decoded.pngBytes.every((n,i)=>n===fixture[i]),'original PNG replaced');assert(decoded.project.sheet.image.data.every((n,i)=>n===working[i]),'working bytes changed');assert(JSON.stringify(decoded.project.draft)===draft&&decoded.view.tab==='paint'&&decoded.view.selectedSource===3,'DAT view/timeline');await fresh(false);await app.openNativeFile('paint.dat',bytes64(dat));assert(!app.paint.root.hidden&&app.paint.sourceId===3&&app.project.sheet.image.data.every((n,i)=>n===working[i]),'actual app reopen');return {version:2,bytes:dat.length,originalPNG:fixture.length,historyAfterOpen:app.project.undoStack.length};});
await check('Fully erased frame retains IDs and key references after DAT v2 reopen',async()=>{await fresh();$('paintTool-eraser').click();change('paintSize','16');stroke(3,3);assert(app.project.sheet.frames[0].data.every((n,i)=>i%4!==3||n===0)&&app.project.sheet.frames.length===4,'erased frame removed');const draft=JSON.stringify(app.project.draft),dat=await app.saveDAT();await fresh(false);await app.openNativeFile('erased.dat',bytes64(dat));assert(app.project.sheet.frames.length===4&&app.project.sheet.frames[0].data.every((n,i)=>i%4!==3||n===0)&&JSON.stringify(app.project.draft)===draft,'erased IDs remapped');return summary();});
await check('Edited PNG native-save packet decodes to working sheet and keeps source bytes',async()=>{await fresh();change('paintHex','#11223344');stroke(7,7);const expected=app.project.sheet.image.data.slice();$('paintExport').click();await wait(()=>w.__packets.some(p=>p.kind==='save-file'));const packet=w.__packets.find(p=>p.kind==='save-file'),png=await decodePNG(decode64(packet.base64)),dat=await decodeProject(await app.saveDAT());assert(packet.name.endsWith('-edited.png')&&png.data.every((n,i)=>n===expected[i]),'export PNG');assert(dat.pngBytes.every((n,i)=>n===fixture[i]),'source PNG changed');return {name:packet.name,pixels:png.data.length};});
await check('Merge/export maps every edited frame and preserves key timing',async()=>{await fresh();change('paintHex','#ABCDEF80');stroke(7,7);change('holdTicks','5');change('fps','17');$('confirm').click();$('merge').click();await wait(()=>app.project.merged&&!d.body.classList.contains('busy'));const m=app.project.merged;let ticks=0;for(const a of m.manifest.animations){const src=app.project.draft[a.row];assert(a.fps===src.fps&&a.loop===src.loop,'FPS/loop changed');assert(a.totalTicks===src.keys.reduce((n,k)=>n+k.ticks,0),'ticks changed');const sourceTicks=src.keys.flatMap(k=>Array.from({length:k.ticks},()=>k.sourceId)),mergedTicks=a.timeline.flatMap(k=>Array.from({length:k.ticks},()=>k.frame));assert(sourceTicks.length===mergedTicks.length,'expanded duration');for(let i=0;i<sourceTicks.length;i++){const key={frame:mergedTicks[i],ticks:1},original={sourceId:sourceTicks[i]},f=m.frames[key.frame];for(let y=0;y<8;y++)for(let x=0;x<8;x++){const p=((f.y+y)*m.width+f.x+x)*4,q=(y*8+x)*4;assert(m.data.subarray(p,p+4).every((n,j)=>n===app.project.sheet.frames[original.sourceId].data[q+j]),'merged pixel differs');}ticks+=key.ticks;}}$('export').click();$('downloadPng').click();$('downloadJson').click();const packets=w.__packets.filter(p=>p.kind==='save-file'),png=await decodePNG(decode64(packets.find(p=>p.name.endsWith('.png')).base64)),json=JSON.parse(new TextDecoder().decode(decode64(packets.find(p=>p.name.endsWith('.json')).base64)));assert(png.data.every((n,i)=>n===m.data[i])&&json.animations[0].fps===17,'export differs');return {merged:m.frames.length,ticks,files:packets.map(p=>p.name)};});
await check('Zoom, fit, actual size and Pan leave pixels/history/time unchanged',async()=>{await fresh();const before={data:copy(app.project.sheet.image.data),time:app.time,history:app.project.undoStack.length};const zoom=app.paint.zoom;$('paintZoomIn').click();assert(app.paint.zoom>zoom,'zoom in');$('paintActual').click();assert(app.paint.zoom===1,'actual');$('paintFit').click();$('paintTool-hand').click();pointer('pointerdown',2,2);pointer('pointermove',4,4);pointer('pointerup',4,4);assert(app.paint.pan.x!==0||app.paint.pan.y!==0,'pan');assert(eq(copy(app.project.sheet.image.data),before.data)&&app.time===before.time&&app.project.undoStack.length===before.history,'viewport edited data');return {zoom:app.paint.zoom,pan:app.paint.pan};});
await check('Paint keyboard: Canvas Space pans; tool shortcuts and text fields never play/delete',async()=>{await fresh();const before=JSON.stringify(app.project.draft);key($('paintCanvas'),'Space');assert(app.paint.space&&!app.playing,'Space played');w.dispatchEvent(new w.KeyboardEvent('keyup',{code:'Space'}));key($('paintCanvas'),'KeyE');assert(app.paint.tool==='eraser','shortcut');for(const id of ['paintHex','paintSize','paintAlpha'])for(const code of ['KeyB','Space','Delete','ArrowRight','KeyZ'])key($(id),code,{ctrlKey:code==='KeyZ'});assert(!app.playing&&JSON.stringify(app.project.draft)===before&&app.paint.tool==='eraser','text key leaked');return summary();});
await check('Each Paint numeric field Space independently cannot start animation',async()=>{const outcomes=[];for(const id of ['paintSize','paintAlpha']){await fresh();key($(id),'Space');outcomes.push({id,playing:app.playing,time:app.time});}assert(outcomes.every(x=>!x.playing),JSON.stringify(outcomes));return outcomes;});
await check('Window blur cancels preview; busy app blocks a new pointer stroke',async()=>{await fresh();pointer('pointerdown',7,7);w.dispatchEvent(new w.Event('blur'));assert(!app.paint.painting&&!app.project.undoStack.length,'blur committed');d.body.classList.add('busy');stroke(7,7);d.body.classList.remove('busy');assert(!app.project.undoStack.length&&!app.paint.painting,'busy painted');return summary();});
await check('Painting invalidates Detect and Merge; Undo baseline permits recompute with original timing',async()=>{await fresh();$('detect').click();$('confirm').click();$('merge').click();await wait(()=>app.project.merged&&!d.body.classList.contains('busy'));paint();stroke(7,7);assert(!app.project.detection&&!app.project.merged&&app.project.dirty&&$('merge').disabled,'stale merge/detect');$('paintUndo').click();assert(!app.project.hasPixelEdits,'undo baseline');$('detect').click();$('confirm').click();$('merge').click();await wait(()=>app.project.merged&&!d.body.classList.contains('busy'));assert(app.project.merged.frames.length===2&&app.project.merged.manifest.animations.every(a=>a.totalTicks===2),'recompute lost duplicates/timing');return {merged:app.project.merged.frames.length,ticks:4};});
await check('Scene Reset clears Paint selection/palette/history and preserves pane preferences',async()=>{await fresh();stroke(7,7);const layout=structuredClone(app.layout);$('fileMenuButton').click();$('menuResetScene').click();$('confirmResetScene').click();assert(!app.project&&$('paintTab').disabled&&app.paint.sourceId===null,'project reset');assert(!d.querySelector('#paintPalette button')&&$('paintUndo').disabled&&$('paintRedo').disabled,'stale Paint state');assert(eq(app.layout,layout),'pane reset');assert($('viewOriginal').textContent==='Original sheet','stale edited sheet label');assert($('sheetSummary').textContent==='Open a PNG or .dat project to begin.','footer');return {summary:$('sheetSummary').textContent,label:$('viewOriginal').textContent};});
const result={build:(await(await fetch('../package.json')).json()).version,bridge:'MOCK save-file only; no native chooser. Synthetic pointer checks stub capture only; physical input recorded separately.',viewport:{width:1280,height:800},records,errors};report.textContent=JSON.stringify(result,null,2);status.textContent=`${records.filter(r=>r.status==='PASS').length}/${records.length} PASS · errors ${errors.length}`;
};
document.getElementById('physical').onclick=async()=>{await fresh();const dat=await app.saveDAT();physicalBefore={source:copy(app.project.sheet.frames[0].data),draft:JSON.stringify(app.project.draft),history:0,datBytes:dat.length};const c=$('paintCanvas');delete c.setPointerCapture;delete c.hasPointerCapture;delete c.releasePointerCapture;change('paintHex','#FF0000FF');$('paintGrid').checked=false;$('paintGrid').dispatchEvent(new w.Event('change'));$('paintFit').click();status.textContent='Ready for real canvas drag / color / keyboard';report.textContent=JSON.stringify({geometry:app.paint.geometry,canvas:copyRect(c.getBoundingClientRect()),frame0:px(app.project.sheet.frames[0],0,0)},null,2);};
function copyRect(r){return {x:r.x,y:r.y,width:r.width,height:r.height};}
document.getElementById('measure').onclick=()=>{const current=app.project.sheet.frames[app.paint.sourceId].data,changes=[];for(let i=0;i<current.length;i+=4)if(current.subarray(i,i+4).some((n,j)=>n!==physicalBefore.source[i+j]))changes.push({x:i/4%8,y:Math.floor(i/32),rgba:copy(current.subarray(i,i+4))});report.textContent=JSON.stringify({physical:true,build:'1.7.0 candidate',before:{history:physicalBefore.history,datBytes:physicalBefore.datBytes},after:{...summary(),color:app.paint.color,size:app.paint.size,tool:app.paint.tool,pan:app.paint.pan,zoom:app.paint.zoom,changes,draftUnchanged:JSON.stringify(app.project.draft)===physicalBefore.draft}},null,2);};
</script>
