<!doctype html><meta charset="utf-8"><title>Sprite Check File / Reset / Compare Log tests</title>
<style>body{margin:0;background:#101521;color:#d9ece3;font:14px Consolas}header{display:flex;gap:8px;padding:8px;flex-wrap:wrap}button{padding:8px;font:14px Consolas;background:#a5f1d0;border:0;cursor:pointer}iframe{display:block;width:1440px;height:940px;border:0}pre{white-space:pre-wrap;max-height:250px;overflow:auto}</style>
<header><button id="run">Run File / Reset / Log checks</button><button id="sample">Prepare sample</button><button id="compact">1280 × 680</button><button id="large">1440 × 940</button><button id="measure">Measure UI</button><span id="status">Loading…</span></header><iframe id="app" src="../index.html" title="File menu test workspace"></iframe><pre id="report"></pre>
<script type="module">
const frame=document.getElementById('app'),status=document.getElementById('status'),report=document.getElementById('report');
const wait=async fn=>{const end=performance.now()+12000;while(!fn()){if(performance.now()>end)throw Error('Timed out');await new Promise(r=>setTimeout(r,20));}};
await wait(()=>frame.contentWindow.spriteCheck?.ready);const w=frame.contentWindow,d=frame.contentDocument,app=w.spriteCheck,$=id=>d.getElementById(id),errors=[];w.addEventListener('error',e=>errors.push(e.message));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
const png=await(await fetch('../assets/test-sheet.png')).arrayBuffer(),assert=(ok,message)=>{if(!ok)throw Error(message);},settle=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(r,60))));
const visible=el=>!!el.getClientRects().length&&w.getComputedStyle(el).visibility!=='hidden';
const rect=el=>{const r=el.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom};};
function key(id,key){$(id).focus();$(id).dispatchEvent(new w.KeyboardEvent('keydown',{key,code:key,bubbles:true,cancelable:true}));}
async function fresh(){const previous=app.project,dt=new w.DataTransfer();dt.items.add(new w.File([png],'file-menu-test.png',{type:'image/png'}));$('fileInput').files=dt.files;$('fileInput').dispatchEvent(new w.Event('change',{bubbles:true}));await wait(()=>app.project!==previous&&!d.body.classList.contains('busy'));await settle();}
function openReset(){$('fileMenuButton').click();$('menuResetScene').click();}
function empty(){return app.project===null&&!app.playing&&app.time===0&&$('stateBadge').textContent==='EMPTY'&&$('filename').title===''&&$('sheetSummary').textContent==='Open a PNG or .dat project to begin.'&&$('exportSummary').textContent===''&&$('sheetCanvas').hidden&&$('rows').children.length===0&&$('keyframes').children.length===0&&$('sourceFrame').options.length===0&&$('compareLogRows').rows.length===0&&$('saveProject').disabled&&$('export').disabled;}
function fontAudit(){const bad=[];let count=0;for(const e of d.querySelectorAll('body *'))if(visible(e)&&([...e.childNodes].some(n=>n.nodeType===3&&n.textContent.trim())||e.matches('button,input,select'))){count++;const size=parseFloat(w.getComputedStyle(e).fontSize);if(size<12)bad.push({id:e.id,size});}return{count,bad};}
let records=[];async function check(id,test){try{records.push({id,status:'PASS',details:await test()});}catch(e){records.push({id,status:'FAIL',observed:e.message});}report.textContent=JSON.stringify({records,errors},null,2);}
document.getElementById('run').onclick=async()=>{records=[];errors.length=0;status.textContent='Running…';frame.style.width='1440px';frame.style.height='940px';await settle();
 await check('File bar is above branding; DAT buttons moved out of sidebar',()=>{assert(rect($('openProject')).bottom<=rect(d.querySelector('.brand')).y+1,'DAT actions not at top');assert(!d.querySelector('.sidebar #openProject')&&!d.querySelector('.sidebar #saveProject'),'Old sidebar actions remain');assert($('saveProject').disabled,'Empty Save enabled');return fontAudit();});
 await check('Menu keyboard skips disabled Save/Reset and closes on Escape',()=>{key('fileMenuButton','ArrowDown');assert(d.activeElement===$('menuOpenPNG'),'First command not focused');key('menuOpenPNG','End');assert(d.activeElement===$('menuUpdate'),'Disabled commands not skipped');key('menuUpdate','Escape');assert($('fileMenu').hidden&&d.activeElement===$('fileMenuButton'),'Escape/focus restore failed');});
 await check('File menu routes PNG/DAT/Save to the existing actions',async()=>{await fresh();const counts={png:0,dat:0,save:0},pngClick=e=>{counts.png++;e.preventDefault();},datClick=e=>{counts.dat++;e.preventDefault();},saveClick=e=>{counts.save++;e.stopImmediatePropagation();};$('fileInput').addEventListener('click',pngClick);$('projectInput').addEventListener('click',datClick);$('saveProject').addEventListener('click',saveClick,{capture:true});for(const id of ['menuOpenPNG','menuOpenProject','menuSaveProject']){$('fileMenuButton').click();$(id).click();assert($('fileMenu').hidden,'Command left menu open');}$('fileInput').removeEventListener('click',pngClick);$('projectInput').removeEventListener('click',datClick);$('saveProject').removeEventListener('click',saveClick,{capture:true});assert(counts.png===1&&counts.dat===1&&counts.save===1,JSON.stringify(counts));return counts;});
 await check('File menu owns arrow/Space/Undo keys without editing or playing',()=>{const draft=JSON.stringify(app.project.draft),time=app.time,history=app.project.undoStack.length;$('fileMenuButton').click();for(const code of ['Space','ArrowLeft','ArrowRight','Delete','KeyZ','KeyY'])$('menuOpenPNG').dispatchEvent(new w.KeyboardEvent('keydown',{code,key:code==='Space'?' ':code,ctrlKey:code.startsWith('Key'),bubbles:true,cancelable:true}));assert(!app.playing&&app.time===time&&app.project.undoStack.length===history&&JSON.stringify(app.project.draft)===draft,'Menu changed animation');key('menuOpenPNG','Escape');});
 await check('New Compare starts with Log hidden; Show/Close releases viewport space',async()=>{$('compareTab').click();assert($('compareLog').hidden&&!app.compare.log,'Log consumes new project viewport');const hiddenHeight=$('compareOriginalStage').clientHeight;$('compareLogToggle').click();await settle();assert(!$('compareLog').hidden&&app.compare.log&&$('compareLogToggle').getAttribute('aria-expanded')==='true','Show failed');const shownHeight=$('compareOriginalStage').clientHeight;$('compareLogClose').click();await settle();assert($('compareLog').hidden&&!app.compare.log&&$('compareOriginalStage').clientHeight>shownHeight,'Close did not reclaim space');assert($('compareOriginalStage').clientHeight===hiddenHeight,'Viewport not restored');return{hiddenHeight,shownHeight,restored:$('compareOriginalStage').clientHeight};});
 await check('Log toggles preserve playback, merged result and key history',async()=>{$('confirm').click();$('merge').click();await wait(()=>app.project.merged&&!d.body.classList.contains('busy'));const merged=app.project.merged,history=app.project.undoStack.length;$('play').click();const before=app.time;for(let i=0;i<4;i++)$('compareLogToggle').click();await settle();assert(app.playing&&app.time>before&&app.project.merged===merged&&app.project.undoStack.length===history,'Log altered document/playback');$('play').click();});
 await check('Reset Cancel preserves the project and layout',()=>{const p=app.project,draft=JSON.stringify(p.draft),layout=app.layout.preferences,time=app.time;openReset();assert($('resetSceneDialog').open,'No confirmation');$('cancelResetScene').click();assert(!$('resetSceneDialog').open&&app.project===p&&JSON.stringify(p.draft)===draft&&app.time===time&&JSON.stringify(app.layout.preferences)===JSON.stringify(layout),'Cancel changed state');});
 await check('Confirm Reset clears playing scene/log/inspector/history but preserves layout',()=>{const layout=app.layout.preferences;$('play').click();openReset();$('confirmResetScene').click();assert(empty(),'Scene not fully empty');assert($('sheetTab').getAttribute('aria-selected')==='true'&&$('compareViewport').hidden&&$('mergeResult').hidden,'Stale Compare/Merge state');assert(JSON.stringify(app.layout.preferences)===JSON.stringify(layout),'Reset changed panel sizes');assert($('previewMode').textContent==='ORIGINAL'&&$('play').textContent==='▶','Stale playback UI');return{layout,empty:empty()};});
 await check('Reset cancels a pending file read instead of reopening it later',async()=>{await fresh();const original=w.File.prototype.arrayBuffer;let release;w.File.prototype.arrayBuffer=function(){return this.name==='delayed.png'?new Promise(resolve=>release=resolve):original.call(this);};try{const dt=new w.DataTransfer();dt.items.add(new w.File([png],'delayed.png',{type:'image/png'}));$('fileInput').files=dt.files;$('fileInput').dispatchEvent(new w.Event('change',{bubbles:true}));assert(release,'File read not pending');openReset();$('confirmResetScene').click();release(png);await settle();assert(empty(),'Old pending import repopulated scene');}finally{w.File.prototype.arrayBuffer=original;}});
 await check('Same PNG can open again after Reset and DAT restores saved Log visibility',async()=>{await fresh();$('compareTab').click();$('compareLogToggle').click();const dat=await app.saveDAT();openReset();$('confirmResetScene').click();const previous=app.project,dt=new w.DataTransfer();dt.items.add(new w.File([dat],'restored.dat',{type:'application/octet-stream'}));$('projectInput').files=dt.files;$('projectInput').dispatchEvent(new w.Event('change',{bubbles:true}));await wait(()=>app.project!==previous&&!d.body.classList.contains('busy'));assert(app.compare.log&&!$('compareLog').hidden&&!$('compareViewport').hidden,'DAT lost Log state/tab');assert($('sheetSummary').textContent.includes('116 frames'),'DAT restored Compare with stale empty summary');});
 await check('Reset immediately after Export Both keeps the requested PNG/JSON pair intact',async()=>{await fresh();$('confirm').click();$('merge').click();await wait(()=>app.project.merged&&!d.body.classList.contains('busy'));const packets=[],desktop=w.spriteCheckDesktop,chrome=w.chrome,bridge=w.chrome?.webview;w.spriteCheckDesktop={version:'test'};w.chrome??={};w.chrome.webview={postMessage:packet=>packets.push(packet)};try{$('export').click();$('downloadBoth').click();$('exportDialog').close();openReset();$('confirmResetScene').click();await wait(()=>packets.length===2);const metadata=JSON.parse(w.atob(packets[1].base64));assert(empty()&&packets[0].name==='file-menu-test-merged.png'&&packets[1].name==='file-menu-test-merged.json'&&metadata.frames.length===107&&metadata.animations.length===12,'Export pair changed/lost after Reset');return packets.map(p=>({name:p.name,bytes:w.atob(p.base64).length}));}finally{w.spriteCheckDesktop=desktop;if(chrome)chrome.webview=bridge;else delete w.chrome;}});
 await check('Compact toolbar/dialog text stays >=12px and Timeline remains reachable',async()=>{await fresh();frame.style.width='1280px';frame.style.height='680px';await settle();assert(fontAudit().bad.length===0,'Small UI font');assert($('scrubber').getBoundingClientRect().bottom<=680,'Timeline outside compact viewport');assert(d.documentElement.scrollWidth<=1280,'Page horizontal overflow');openReset();assert(fontAudit().bad.length===0&&rect($('resetSceneDialog')).bottom<=680,'Reset dialog font/size');$('cancelResetScene').click();return fontAudit();});
 await check('Menu closes on outside click and is disabled correctly after Reset',()=>{$('fileMenuButton').click();d.querySelector('.overview').dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true}));assert($('fileMenu').hidden,'Outside click left menu open');openReset();$('confirmResetScene').click();$('fileMenuButton').click();assert($('menuSaveProject').disabled&&$('menuResetScene').disabled&&!$('menuOpenPNG').disabled&&!$('menuOpenProject').disabled,'Empty menu state wrong');key('menuOpenPNG','Escape');});
 const fail=records.filter(r=>r.status==='FAIL');status.textContent=`${fail.length?'FAIL':'PASS'} ${records.length-fail.length}/${records.length} · errors ${errors.length}`;report.textContent=JSON.stringify({records,errors},null,2);};
document.getElementById('sample').onclick=async()=>{await fresh();$('compareTab').click();status.textContent='Sample ready';};document.getElementById('compact').onclick=()=>{frame.style.width='1280px';frame.style.height='680px';};document.getElementById('large').onclick=()=>{frame.style.width='1440px';frame.style.height='940px';};document.getElementById('measure').onclick=()=>{report.textContent=JSON.stringify({layout:app.layout,log:app.compare.log,stage:rect($('compareOriginalStage')),fonts:fontAudit(),project:!!app.project},null,2);};status.textContent='Ready';
</script>
