<!doctype html><meta charset="utf-8"><title>Sprite Check project file verification</title>
<style>body{margin:0;background:#101521;color:#d9ece3;font:12px Consolas,monospace}header{display:flex;padding:12px;gap:18px;align-items:center}button{padding:10px;background:#a5f1d0;border:0;cursor:pointer}iframe{border:0;width:100%;height:calc(100vh - 60px)}ol{position:fixed;right:12px;top:54px;background:#10291fef;line-height:1.8;padding:15px 30px;max-width:550px}ol:empty{display:none}</style>
<header><button id="run">Run DAT roundtrip tests</button><span id="status">Loading…</span></header><iframe id="app" title="Project file test workspace" src="../index.html"></iframe><ol id="results"></ol>
<script type="module">
import {decodeProject} from '../project-file.mjs';
const frame=document.getElementById('app'),status=document.getElementById('status'),results=document.getElementById('results');
const wait=async condition=>{const end=performance.now()+10000;while(!condition()){if(performance.now()>end)throw Error('Timed out');await new Promise(r=>setTimeout(r,25));}};
const assert=(v,msg)=>{if(!v)throw Error(msg);},add=msg=>{const li=document.createElement('li');li.textContent='PASS · '+msg;results.append(li);};
await wait(()=>frame.contentWindow.spriteCheck?.ready);const startWindow=frame.contentWindow,startDoc=frame.contentDocument,startFiles=new startWindow.DataTransfer();startFiles.items.add(new startWindow.File([await(await fetch('../assets/test-sheet.png')).arrayBuffer()],'SkeletonSword-demo.png',{type:'image/png'}));startDoc.getElementById('fileInput').files=startFiles.files;startDoc.getElementById('fileInput').dispatchEvent(new startWindow.Event('change',{bubbles:true}));await wait(()=>frame.contentWindow.spriteCheck.project&&!startDoc.body.classList.contains('busy'));status.textContent='Ready';
document.getElementById('run').onclick=async()=>{try{
 results.replaceChildren();status.textContent='Running…';const w=frame.contentWindow,d=frame.contentDocument,app=w.spriteCheck,$=id=>d.getElementById(id);
 const png=await (await fetch('../assets/test-sheet.png')).arrayBuffer();
 const input=async(id,data,name,type)=>{const files=new w.DataTransfer();files.items.add(new w.File([data],name,{type}));$(id).files=files.files;await new Promise((resolve,reject)=>{let started=false;const timeout=setTimeout(()=>{observer.disconnect();reject(Error('File input did not complete'));},10000);const observer=new MutationObserver(()=>{if(d.body.classList.contains('busy'))started=true;else if(started){clearTimeout(timeout);observer.disconnect();resolve();}});observer.observe(d.body,{attributes:true,attributeFilter:['class']});$(id).dispatchEvent(new w.Event('change',{bubbles:true}));});};
 assert($('openProject')&&$('saveProject'),'Missing project buttons');add('OPEN .DAT / SAVE .DAT controls visible');
 $('holdTicks').value=5;$('holdTicks').dispatchEvent(new w.Event('change'));$('fps').value=17;$('fps').dispatchEvent(new w.Event('change'));$('loop').click();d.querySelectorAll('#keyframes button')[1].click();$('deleteKey').click();$('detect').click();await wait(()=>!d.body.classList.contains('busy'));$('confirm').click();$('mergeScope').value='sheet';$('merge').click();await wait(()=>app.project.merged&&!d.body.classList.contains('busy'));$('compareTab').click();
 const expected=JSON.stringify(app.project.draft),packed=app.project.merged.data.slice(),dat=await app.saveDAT();assert(dat.length>png.byteLength,'Missing source bytes');add('DAT serializes changed hold, removal, FPS, loop and cross-row Merge');
 await input('fileInput',png,'new-source.png','image/png');assert(app.project.draft[0].keys[0].ticks===1&&app.project.merged===null,'Source not reset');add('New PNG replaces working document before restore');
 await input('projectInput',dat,'roundtrip.dat','application/octet-stream');assert(JSON.stringify(app.project.draft)===expected,'Timeline changed');assert(app.project.merged&&packed.every((b,i)=>b===app.project.merged.data[i]),'Merged pixels changed');assert(!$('compareViewport').hidden&&$('fps').value==='17'&&!$('loop').checked,'View/FPS/Loop lost');add('Open .dat FileList restores exact timeline, packed pixels and Compare');
 $('holdTicks').value=7;$('holdTicks').dispatchEvent(new w.Event('change'));const dirty=JSON.stringify(app.project.draft),dirtyDat=await app.saveDAT();await input('fileInput',png,'source-again.png','image/png');
 const transfer=new w.DataTransfer();transfer.items.add(new w.File([dirtyDat],'dropped-project.dat',{type:'application/octet-stream'}));const previousDrop=app.project;$('sheetCanvas').dispatchEvent(new w.DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:transfer}));await wait(()=>app.project!==previousDrop);await wait(()=>!d.body.classList.contains('busy'));assert(app.project.dirty&&JSON.stringify(app.project.draft)===dirty,'Dirty changes lost');assert(app.project.confirmed&&app.project.merged===null,'Confirmation boundary lost');add('Viewport .dat drop restores unconfirmed edits and old confirmation separately');
 const before=app.project,corrupt=dirtyDat.slice();corrupt[corrupt.length-1]^=1;await input('projectInput',corrupt,'broken.dat','application/octet-stream');assert(app.project===before&&JSON.stringify(app.project.draft)===dirty,'Corrupt file changed project');assert($('toast').textContent.includes('checksum'),'Missing checksum message');add('Damaged .dat preserves active project and shows checksum error');
 $('confirm').click();$('merge').click();await wait(()=>app.project.merged&&!d.body.classList.contains('busy'));assert(app.project.merged.manifest.animations[0].fps===17,'Restored project cannot merge');add('Restored draft remains editable and can Confirm / Merge again');
 const embedded=(await decodeProject(dat)).pngBytes,original=new Uint8Array(png);assert(embedded.length===original.length&&embedded.every((b,i)=>b===original[i]),'Embedded PNG changed');add('Source PNG stays byte-exact inside DAT; no external image path required');
 status.textContent='PASS 8 / 8';document.body.dataset.result='pass';
 }catch(error){status.textContent='FAIL '+error.message;document.body.dataset.result='fail';const li=document.createElement('li');li.textContent=status.textContent;results.append(li);console.error(error);}};
</script>
