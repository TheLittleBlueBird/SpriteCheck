<!doctype html><meta charset="utf-8"><title>Dewey Compare regression</title>
<style>body{margin:0;background:#101521;color:#d9ece3;font:12px Consolas}header{padding:8px;display:flex;gap:15px;align-items:center}button{padding:8px;background:#a5f1d0;border:0}iframe{width:1480px;height:850px;border:0}pre{white-space:pre-wrap;max-height:260px;overflow:auto}</style>
<header><button id="run">Run Dewey Compare checks</button><button id="hide">Hide results</button><button id="snapshot">Record physical state</button><span id="status">Loading</span></header><iframe id="app" src="../index.html"></iframe><pre id="physical"></pre><pre id="report"></pre>
<script type="module">
const frame=document.getElementById('app'),status=document.getElementById('status'),report=document.getElementById('report');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function wait(fn){const until=performance.now()+12000;while(!fn()){if(performance.now()>until)throw Error('timeout');await sleep(20);}}
await wait(()=>frame.contentWindow.spriteCheck?.ready);const w=frame.contentWindow,d=frame.contentDocument,$=id=>d.getElementById(id),app=w.spriteCheck;
let records=[],errors=[];w.addEventListener('error',e=>errors.push(e.message));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
const assert=(value,message)=>{if(!value)throw Error(message);};
const change=(id,value)=>{$(id).value=value;$(id).dispatchEvent(new w.Event('change',{bubbles:true}));};
const hash=id=>{const c=$(id),data=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let h=2166136261;for(const v of data)h=Math.imul(h^v,16777619);return h>>>0;};
const visible=el=>w.getComputedStyle(el).display!=='none'&&el.getBoundingClientRect().height>0;
function expectedPixel(side){
 const p=app.project,row=8,a=side==='Original'?p.sheet.original[row]:p.draft[row];
 let t=Math.floor(app.time*a.fps+1e-7),total=a.keys.reduce((n,k)=>n+k.ticks,0);t=$('loop').checked?t%total:Math.min(total-1,t);
 let key=a.keys.at(-1);for(const k of a.keys){if(t<k.ticks){key=k;break;}t-=k.ticks;}
 const src=p.sheet.frames[key.sourceId],s=d.createElement('canvas');s.width=p.sheet.grid.cellWidth;s.height=p.sheet.grid.cellHeight;s.getContext('2d').putImageData(new w.ImageData(src.data,s.width,s.height),0,0);
 const c=$('compare'+side),stage=$('compare'+side+'Stage'),expected=d.createElement('canvas');expected.width=c.width;expected.height=c.height;
 const ctx=expected.getContext('2d'),dpr=Math.min(2,w.devicePixelRatio||1),ww=stage.clientWidth,hh=stage.clientHeight,settings=app.compare[side==='Original'?'left':'right'];
 let fit=Math.min(ww*.78/s.width,hh*.88/s.height);if(fit>=1)fit=Math.floor(fit);const scale=Math.max(.001,fit)*settings.zoom;
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;ctx.translate(ww/2+settings.x,hh/2+settings.y);ctx.scale(scale,scale);ctx.drawImage(s,-s.width/2,-s.height/2);
 const actual=c.getContext('2d').getImageData(0,0,c.width,c.height).data,exp=ctx.getImageData(0,0,c.width,c.height).data;
 assert(actual.length===exp.length,'canvas dimensions');for(let i=0;i<actual.length;i++)if(actual[i]!==exp[i])throw Error(`${side} actual pixel ${i}=${actual[i]} expected ${exp[i]} at ${app.time}s`);
 return {time:app.time,source:key.sourceId,hash:hash('compare'+side),width:c.width,height:c.height};
}
function fitBoth(){change('compareOriginalMode','animation');$('compareOriginalFit').click();$('compareMergedFit').click();}
async function check(id,fn){try{if(app.playing)$('play').click();const details=await fn();records.push({id,status:'PASS',details:structuredClone(details)});}catch(e){records.push({id,status:'FAIL',observed:e.message});}report.textContent=JSON.stringify({records,errors},null,2);}
async function fresh(){const png=await(await fetch('../assets/test-sheet.png')).arrayBuffer();const dt=new w.DataTransfer();dt.items.add(new w.File([png],'dewey-compare.png',{type:'image/png'}));$('fileInput').files=dt.files;$('fileInput').dispatchEvent(new w.Event('change',{bubbles:true}));await wait(()=>app.project&&!d.body.classList.contains('busy'));d.querySelector('[data-row="8"]').click();$('compareTab').click();}
async function playback(prefix){
 await check(prefix+' animation pixels/step/scrub',async()=>{fitBoth();$('firstFrame').click();const initial=hash('compareOriginal');$('nextFrame').click();assert(Math.abs(app.time-1/Number($('fps').value))<1e-7,'step time');expectedPixel('Original');expectedPixel('Merged');$('prevFrame').click();assert(app.time===0,'previous');$('scrubber').value='4';$('scrubber').dispatchEvent(new w.Event('input',{bubbles:true}));assert(Math.abs(app.time-4/Number($('fps').value))<1e-7,'scrub time');const pixels=expectedPixel('Original');expectedPixel('Merged');assert(initial!==pixels.hash,'scrub actual pixels did not change');return pixels;});
 await check(prefix+' Play/Pause/Space clock+pixels',async()=>{$('firstFrame').click();$('play').click();await wait(()=>app.time>.15);assert(app.playing,'clock did not advance');$('play').click();assert(!app.playing,'pause');const at=app.time;const pixels=expectedPixel('Original');expectedPixel('Merged');await sleep(100);assert(app.time===at,'pause time drift');$('loop').dispatchEvent(new w.KeyboardEvent('keydown',{code:'Space',key:' ',bubbles:true}));assert(app.playing,'Space did not play');$('loop').dispatchEvent(new w.KeyboardEvent('keydown',{code:'Space',key:' ',bubbles:true}));assert(!app.playing,'Space did not pause');return pixels;});
 await check(prefix+' loop/nonloop end',async()=>{const remerge=async()=>{if(prefix==='postMerge'){$('confirm').click();$('merge').click();await wait(()=>app.project.merged&&!d.body.classList.contains('busy'));}};$('loop').checked=false;$('loop').dispatchEvent(new w.Event('change',{bubbles:true}));await remerge();$('scrubber').value=String(Number($('scrubber').max));$('scrubber').dispatchEvent(new w.Event('input',{bubbles:true}));$('play').click();await wait(()=>!app.playing);expectedPixel('Original');expectedPixel('Merged');$('loop').checked=true;$('loop').dispatchEvent(new w.Event('change',{bubbles:true}));await remerge();$('firstFrame').click();$('play').click();await wait(()=>app.time>1.5);$('play').click();assert(app.time>1.5,'loop clock');expectedPixel('Original');expectedPixel('Merged');return {time:app.time};});
 await check(prefix+' loop pause/resume preserves phase',async()=>{const before=app.time;$('play').click();const after=app.time;$('play').click();assert(Math.abs(after-before)<1e-7,`loop resume reset clock: before=${before}, after=${after}`);return {before,after};});
 await check(prefix+' paused Compare to Sheet resume phase',async()=>{const before=app.time;$('sheetTab').click();const a=app.mode==='original'?app.project.sheet.original[8]:app.project.draft[8],duration=a.keys.reduce((n,k)=>n+k.ticks,0)/a.fps;$('play').click();const after=app.time;$('play').click();assert(Math.abs(after-before%duration)<1e-7,`Sheet resume phase before=${before} after=${after} duration=${duration}`);$('compareTab').click();expectedPixel('Original');expectedPixel('Merged');return {before,after,duration};});
 await check(prefix+' switch tabs paused+playing',async()=>{fitBoth();$('compareOriginalIn').click();const settings=JSON.stringify(app.compare),before=app.time;$('sheetTab').click();assert(visible(d.querySelector('.canvas-toolbar')),'sheet toolbar missing');assert(app.time===before,'paused tab changed time');$('compareTab').click();assert(!visible(d.querySelector('.canvas-toolbar')),'sheet toolbar leaked in Compare');assert(settings===JSON.stringify(app.compare),'zoom lost');expectedPixel('Original');$('play').click();const t=app.time;$('sheetTab').click();await wait(()=>app.time!==t);$('compareTab').click();const resumed=app.time;await wait(()=>app.time!==resumed);$('play').click();assert(app.time!==t,'clock stopped across tabs');assert(settings===JSON.stringify(app.compare),'playing zoom lost');expectedPixel('Original');expectedPixel('Merged');return {before,after:app.time,settings:app.compare};});
}
document.getElementById('hide').onclick=()=>report.hidden=!report.hidden;document.getElementById('snapshot').onclick=()=>{document.getElementById('physical').textContent=JSON.stringify({time:app.time,playing:app.playing,settings:app.compare,hashes:{left:hash('compareOriginal'),right:hash('compareMerged')},visibility:document.visibilityState},null,2);};
document.getElementById('run').onclick=async()=>{records=[];errors=[];status.textContent='Running';await fresh();
 await playback('preMerge');
 await check('FPS/Hold compare independent timing',async()=>{change('fps','24');change('holdTicks','3');$('firstFrame').click();$('nextFrame').click();assert(Math.abs(app.time-1/24)<1e-7,'FPS step mismatch');expectedPixel('Original');expectedPixel('Merged');return {fps:app.project.draft[8].fps,time:app.time};});
 await check('zoom in/out/wheel/Fit/1:1/unlink/link',async()=>{fitBoth();const h=hash('compareOriginal');$('compareOriginalIn').click();assert(app.compare.left.zoom===1.25&&app.compare.right.zoom===1.25,'linked zoom');assert(hash('compareOriginal')!==h,'zoom pixels unchanged');$('compareOriginalOut').click();assert(Math.abs(app.compare.left.zoom-1)<1e-8,'zoom out');const event=new w.WheelEvent('wheel',{deltaY:-100,clientX:500,clientY:300,bubbles:true,cancelable:true});$('compareOriginalStage').dispatchEvent(event);assert(event.defaultPrevented&&app.compare.left.zoom>1,'wheel zoom');$('compareOriginalActual').click();assert($('compareOriginalZoom').textContent==='100%','1:1 not100');$('compareOriginalFit').click();assert(app.compare.left.zoom===1,'Fit normalization');$('compareLink').checked=false;$('compareLink').dispatchEvent(new w.Event('change',{bubbles:true}));const right=app.compare.right.zoom;$('compareOriginalIn').click();assert(app.compare.right.zoom===right,'unlinked zoom changed right');$('compareLink').checked=true;$('compareLink').dispatchEvent(new w.Event('change',{bubbles:true}));assert(JSON.stringify(app.compare.left)===JSON.stringify(app.compare.right),'link sync');return app.compare;});
 await check('preMerge Sheet mode and return Animation',async()=>{change('compareOriginalMode','sheet');assert(app.compare.right.mode==='sheet','linked mode');assert(hash('compareOriginal')!==hash('compareMerged'),'unmerged right placeholder');change('compareOriginalMode','animation');expectedPixel('Original');expectedPixel('Merged');});
 await check('Merge ready',async()=>{$('confirm').click();$('merge').click();await wait(()=>app.project.merged&&!d.body.classList.contains('busy'));$('compareTab').click();assert(!visible(d.querySelector('.canvas-toolbar')),'toolbar after merge');});
 await playback('postMerge');
 await check('postMerge Sheet mode pixels + mode reset',async()=>{change('compareOriginalMode','sheet');assert(app.compare.left.zoom===1&&app.compare.left.x===0,'mode did not normalize');const hashes={original:hash('compareOriginal'),merged:hash('compareMerged')};assert(hashes.original!==hashes.merged,'packed sheet appears identical');$('sheetTab').click();$('compareTab').click();assert(app.compare.left.mode==='sheet'&&app.compare.right.mode==='sheet','sheet compare mode lost');$('compareOriginalActual').click();assert($('compareOriginalZoom').textContent==='100%','sheet actual size');assert(hash('compareOriginal')!==hashes.original,'sheet1:1 pixels unchanged');$('compareLink').checked=false;$('compareLink').dispatchEvent(new w.Event('change',{bubbles:true}));const left=hash('compareOriginal');$('compareMergedIn').click();assert(hash('compareOriginal')===left,'unlinked sheet changed left');$('compareLink').checked=true;$('compareLink').dispatchEvent(new w.Event('change',{bubbles:true}));$('compareOriginalFit').click();return {...hashes,mergedPresent:!!app.project.merged};});
 status.textContent=`${records.filter(r=>r.status==='PASS').length}/${records.length} PASS · errors ${errors.length}`;report.textContent=JSON.stringify({build:'1.3.1',viewport:{width:w.innerWidth,height:w.innerHeight},visibility:{top:document.visibilityState,iframe:d.visibilityState},records,errors},null,2);
};status.textContent='Ready';
</script>
