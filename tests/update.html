<!doctype html><meta charset="utf-8"><title>Sprite Check Update UI tests</title>
<style>body{background:#101521;color:#e5efe9;font:14px Consolas;margin:0}header{padding:8px}button{font:14px Consolas;padding:8px}iframe{display:block;width:1280px;height:760px;border:0}pre{white-space:pre-wrap}</style>
<header><button id="run">Run Update UI tests</button> <span id="status">Ready</span></header><iframe id="app" title="Update QA workspace"></iframe><pre id="report"></pre>
<script type="module">
import {decodeProject} from '../project-file.mjs';
const frame=document.getElementById('app'),report=document.getElementById('report'),status=document.getElementById('status'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const wait=async fn=>{const end=performance.now()+10000;while(!fn()){if(performance.now()>end)throw Error('Timeout');await sleep(20);}};
let w,d,$,packets,send,records=[],errors=[];
const assert=(ok,msg)=>{if(!ok)throw Error(msg);},fixture=await(await fetch('../assets/test-sheet.png')).arrayBuffer();
async function fresh(){
 let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href)+'">');
 html=html.replace('<script type="module" src="app.mjs">',`<script>window.__packets=[];window.spriteCheckDesktop={version:'1.6.0'};window.chrome??={};window.chrome.webview={postMessage:p=>__packets.push(p),addEventListener:(type,f)=>(window.__nativeListeners??=[]).push(f)};<\/script><script type="module" src="app.mjs">`);
 frame.srcdoc=html;await new Promise(r=>frame.onload=r);w=frame.contentWindow;d=frame.contentDocument;$=id=>d.getElementById(id);await wait(()=>w.spriteCheck?.ready);packets=w.__packets;send=p=>w.__nativeListeners.forEach(f=>f({data:{kind:'update-state',requestId:packets.at(-1).requestId,...p}}));
 w.addEventListener('error',e=>errors.push(e.message));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
}
function menu(){ $('fileMenuButton').click();$('menuUpdate').click(); }
async function check(name,fn){try{const detail=await fn();records.push({name,status:'PASS',detail});}catch(error){records.push({name,status:'FAIL',error:String(error)});}}
document.getElementById('run').onclick=async()=>{
 records=[];errors=[];status.textContent='Running';await fresh();
 await check('File Update is enabled in empty startup and opens a checking dialog',()=>{assert(!w.spriteCheck.project,'Not empty');menu();assert($('updateDialog').open&&packets.at(-1).kind==='update-check'&&$('fileMenu').hidden,'Menu update unavailable');});
 await check('Current release has no install action; release notes are rendered as plain text',()=>{send({state:'current',version:'1.6.0',notes:'<img src=x onerror=alert(1)>'});assert($('updateInstall').hidden&&!$('updateClose').disabled,'Current offers install');assert(!$('updateNotes').querySelector('img')&&$('updateNotes').textContent.startsWith('<img'),'Unsafe notes rendering');});
 await check('Dismissed check ignores stale response and retry recovers from errors',()=>{$('updateCheck').click();const old=packets.at(-1).requestId;$('updateClose').click();send({requestId:old,state:'available',version:'1.6.1'});assert(!$('updateDialog').open&&$('updateInstall').hidden,'Stale response applied');menu();send({state:'error',message:'offline'});assert($('updateStatus').textContent==='offline'&&!$('updateCheck').disabled,'Retry disabled');$('updateCheck').click();send({state:'current',version:'1.6.0'});$('updateClose').click();});
 await check('Checking preserves animation, draft, selection and undo history',async()=>{let b='';for(const value of new Uint8Array(fixture))b+=String.fromCharCode(value);await w.spriteCheck.openNativeFile('update-qa.png',w.btoa(b));$('holdPlus').click();$('compareTab').click();$('play').click();const draft=JSON.stringify(w.spriteCheck.project.draft),history=w.spriteCheck.project.undoStack.length,time=w.spriteCheck.time;menu();send({state:'available',version:'1.6.1',notes:'Patch notes'});await sleep(80);assert(w.spriteCheck.playing&&w.spriteCheck.time>time&&JSON.stringify(w.spriteCheck.project.draft)===draft&&w.spriteCheck.project.undoStack.length===history,'Check modified project');$('updateClose').click();assert(w.spriteCheck.playing,'Cancel paused animation');});
 await check('Update dialog owns Space/Undo and Escape closes without changing project',()=>{menu();send({state:'available',version:'1.6.1'});const p=w.spriteCheck.project,t=w.spriteCheck.playing,n=p.undoStack.length;$('updateCheck').dispatchEvent(new w.KeyboardEvent('keydown',{code:'Space',key:' ',bubbles:true,cancelable:true}));$('updateCheck').dispatchEvent(new w.KeyboardEvent('keydown',{code:'KeyZ',key:'z',ctrlKey:true,bubbles:true,cancelable:true}));assert(w.spriteCheck.playing===t&&p.undoStack.length===n,'Shortcut leaked');$('updateClose').click();});
 await check('Update captures exact dirty draft and original PNG in recovery DAT before restart request',async()=>{menu();send({state:'available',version:'1.6.1'});const draft=JSON.stringify(w.spriteCheck.project.draft),history=w.spriteCheck.project.undoStack.length;$('updateInstall').click();await wait(()=>packets.at(-1).kind==='update-install');assert(!w.spriteCheck.playing&&$('updateClose').disabled&&$('updateCheck').disabled,'Install not locked');const data=Uint8Array.from(w.atob(packets.at(-1).session),c=>c.charCodeAt(0)),decoded=await decodeProject(data);assert(JSON.stringify(decoded.project.draft)===draft&&decoded.pngBytes.every((v,i)=>v===new Uint8Array(fixture)[i]),'Recovery lost project');assert(w.spriteCheck.project.undoStack.length===history,'Install changed history');return{recoveryBytes:data.length};});
 await check('Download progress and errors unlock the dialog without modifying the scene',()=>{send({state:'downloading',percent:65,version:'1.6.1'});assert($('updateProgress').value===65&&!$('updateProgress').hidden,'No progress');const cancel=new w.Event('cancel',{cancelable:true});$('updateDialog').dispatchEvent(cancel);assert(cancel.defaultPrevented&&$('updateDialog').open,'Escape closed during install');send({state:'error',message:'Checksum mismatch'});assert(!$('updateClose').disabled&&$('updateProgress').hidden&&w.spriteCheck.project.draft[0].keys[0].ticks===2,'Error lost scene');});
 await check('Compact Update text is >=12px and dialog stays on screen',()=>{const bad=[...d.querySelectorAll('#updateDialog *')].filter(e=>e.getClientRects().length&&e.textContent.trim()&&parseFloat(w.getComputedStyle(e).fontSize)<12);const r=$('updateDialog').getBoundingClientRect();assert(!bad.length&&r.top>=0&&r.bottom<=760&&r.right<=1280,'Dialog unreadable/outside screen');return{width:r.width,height:r.height};});
 $('updateClose').click();status.textContent=`${records.some(r=>r.status==='FAIL')?'FAIL':'PASS'} ${records.filter(r=>r.status==='PASS').length}/${records.length} · errors ${errors.length}`;report.textContent=JSON.stringify({records,errors},null,2);
};
</script>
