<!doctype html><meta charset="utf-8"><title>Sprite Check icons and background QA</title>
<style>body{margin:0;background:#101521;color:#eff;font:14px Consolas}header{padding:8px;display:flex;gap:10px}button{padding:7px;font:14px Consolas}iframe{width:1440px;height:940px;border:0;display:block}pre{white-space:pre-wrap}</style>
<header><button id="run">Run icons / background QA</button><button id="prepare">Prepare real Alt click</button><button id="measure">Measure real Alt click</button><span id="status">Ready</span></header><iframe id="app" title="Owned icons and background test workspace"></iframe><pre id="report"></pre>
<script type="module">
import {encodePNG,decodePNG} from '../png.mjs';
const frame=document.getElementById('app'),report=document.getElementById('report'),status=document.getElementById('status');
let w,d,app,$,records=[],errors=[],serial=0,physical;
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),assert=(ok,m)=>{if(!ok)throw Error(m);},eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
async function wait(fn){const end=performance.now()+15000;while(!fn()){if(performance.now()>end)throw Error('timeout');await sleep(20);}}
function bytes64(b){return btoa(Array.from(b,c=>String.fromCharCode(c)).join(''));}
function change(id,value,type='change'){$(id).value=value;$(id).dispatchEvent(new w.Event(type,{bubbles:true}));}
const data=new Uint8ClampedArray(16*16*4);for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(x%8<4&&y%8<4)data.set([255,0,255,255],(y*16+x)*4);
const fixture=await encodePNG({width:16,height:16,data});
async function fresh(load=true){const token=++serial;let html=await(await fetch('../index.html')).text();html=html.replace('<head>','<head><base href="'+new URL('../',location.href)+'">').replace('<script type="module" src="app.mjs">',`<script>window.__qaSession=${token};window.__packets=[];window.spriteCheckDesktop={version:'1.7.1'};window.chrome??={};window.chrome.webview={postMessage:p=>__packets.push(p),addEventListener:()=>{}};<\/script><script type="module" src="app.mjs">`);frame.srcdoc=html;await wait(()=>frame.contentWindow?.__qaSession===token&&frame.contentWindow?.spriteCheck?.ready);w=frame.contentWindow;d=frame.contentDocument;app=w.spriteCheck;$=id=>d.getElementById(id);w.addEventListener('error',e=>errors.push(e.message));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));if(load){await app.openNativeFile('background-fixture.png',bytes64(fixture));$('openGrid').click();change('cellWidth','8');change('cellHeight','8');$('gridForm').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));}}
function snapshot(){return JSON.stringify({pixels:[...app.project.sheet.image.data],original:[...app.project.originalSheet.image.data],draft:app.project.draft,history:app.project.undoStack,redo:app.project.redoStack,time:app.time,dirty:app.project.dirty});}
function surfaces(){return [...d.querySelectorAll('.checker')].map(e=>({id:e.id||e.className,color:w.getComputedStyle(e).backgroundColor,image:w.getComputedStyle(e).backgroundImage}));}
function publish(){report.textContent=JSON.stringify({records,errors},null,2);status.textContent=`${records.filter(r=>r.status==='PASS').length} PASS / ${records.filter(r=>r.status==='FAIL').length} FAIL`;}
async function check(name,fn){try{records.push({name,status:'PASS',details:await fn()});}catch(e){records.push({name,status:'FAIL',message:e.message});}publish();}
document.getElementById('run').onclick=async()=>{records=[];errors=[];const old=localStorage.getItem('sprite-check-background-v1');try{
 await check('Empty startup exposes background without opening an image',async()=>{await fresh(false);assert(!app.project,'auto image');assert($('canvasBackgroundMode')&&$('canvasBackgroundColor'),'missing controls');$('canvasBackgroundMode').value='checker';$('canvasBackgroundMode').dispatchEvent(new w.Event('change'));assert(surfaces().every(s=>s.image!=='none'),'checker default');return surfaces();});
 await check('All five viewport surfaces share white, gray, black and custom color',async()=>{await fresh();const before=snapshot();for(const color of ['#ffffff','#808080','#111111','#1a9c63']){change('canvasBackgroundColor',color,'input');assert(surfaces().length===5,'surface count');assert(surfaces().every(s=>s.image==='none'&&s.color===`rgb(${color.slice(1).match(/../g).map(x=>parseInt(x,16)).join(', ')})`),'surface color mismatch');}assert(snapshot()===before,'background edited project');return surfaces();});
 await check('Switch Sheet / Compare animation / Compare sheet / Paint retains global background',async()=>{for(const id of ['sheetTab','compareTab','paintTab','sheetTab']){$(id).click();if(id==='compareTab'){change('compareOriginalMode','sheet');change('compareMergedMode','sheet');change('compareOriginalMode','animation');}assert(surfaces().every(s=>s.image==='none'&&s.color==='rgb(26, 156, 99)'),'tab lost background');}return {mode:$('canvasBackgroundMode').value};});
 await check('Paint icons have readable accessible names, tooltips and selected state',async()=>{$('paintTab').click();for(const id of ['pencil','eraser','eyedropper','fill','line','hand']){const b=$('paintTool-'+id);assert(b.querySelector('svg')?.getAttribute('aria-hidden')==='true','missing icon');assert(b.getAttribute('aria-label')&&b.title,'missing accessible label');b.click();assert(app.paint.tool===id&&b.getAttribute('aria-pressed')==='true','tool button failed');}assert($('paintTool-eyedropper').title.includes('Alt + left click')&&!$('paintTool-eyedropper').title.includes('(I)'),'old shortcut');return [...d.querySelectorAll('[data-tool]')].map(b=>({name:b.getAttribute('aria-label'),title:b.title}));});
 await check('Alt picker reads sprite RGBA even on custom background and Hand stays active',async()=>{app.paint.setTool('hand');app.paint.setColor([1,2,3,4]);const before=snapshot(),p=app.paint,g=p.geometry,r=p.canvas.getBoundingClientRect();p.canvas.dispatchEvent(new w.PointerEvent('pointerdown',{button:0,pointerId:9,altKey:true,clientX:r.left+g.x+g.scale/2,clientY:r.top+g.y+g.scale/2,bubbles:true,cancelable:true}));assert(eq(app.paint.color,[255,0,255,255])&&app.paint.tool==='hand'&&!app.paint.drag&&!app.paint.stroke,'Alt picker failed');assert(snapshot()===before,'picker edited data/history');return {rgba:app.paint.color,tool:app.paint.tool};});
 await check('Palette and background controls never start playback with Space or erase keys',async()=>{const before=snapshot();for(const id of ['canvasBackgroundMode','canvasBackgroundColor'])for(const code of ['Space','Delete','KeyZ']){$(id).dispatchEvent(new w.KeyboardEvent('keydown',{code,key:code==='Space'?' ':code,ctrlKey:code==='KeyZ',bubbles:true,cancelable:true}));}assert(!app.playing&&snapshot()===before,'control leaked shortcut');return {playing:app.playing};});
 await check('Edited PNG stays exact RGBA with transparent pixels; background is not baked',async()=>{$('paintExport').click();await wait(()=>w.__packets.some(p=>p.kind==='save-file'));const p=w.__packets.find(p=>p.kind==='save-file'),png=await decodePNG(Uint8Array.from(atob(p.base64),c=>c.charCodeAt(0)));assert(eq([...png.data],[...data]),'export pixel mismatch');assert(png.data[7*4+3]===0,'alpha baked');return {width:png.width,height:png.height,alpha:png.data[31]};});
 await check('Background survives app reload and does not load a previous project',async()=>{await fresh(false);assert($('canvasBackgroundMode').value==='solid'&&$('canvasBackgroundColor').value==='#1a9c63','preference lost');assert(!app.project,'project auto opened');return surfaces();});
 await check('Checkerboard restore preserves selected custom color',async()=>{change('canvasBackgroundMode','checker');assert(surfaces().every(s=>s.image.includes('gradient')),'checker not restored');assert($('canvasBackgroundColor').value==='#1a9c63','color discarded');return {stored:JSON.parse(localStorage.getItem('sprite-check-background-v1'))};});
 await check('Top controls fit desktop, laptop and compact layouts; visible fonts >=12px',async()=>{const sizes=[];for(const [width,height]of [[1440,940],[1280,680],[760,820],[480,820]]){frame.style.width=width+'px';frame.style.height=height+'px';await sleep(100);const controls=$('canvasBackgroundMode').getBoundingClientRect(),color=$('canvasBackgroundColor').getBoundingClientRect();assert(controls.left>=0&&color.right<=width,'background outside window');const text=[...d.querySelectorAll('body *')].filter(e=>e.getClientRects().length&&w.getComputedStyle(e).visibility!=='hidden'&&([...e.childNodes].some(n=>n.nodeType===3&&n.textContent.trim())||e.matches('input,select,button')));assert(text.every(e=>parseFloat(w.getComputedStyle(e).fontSize)>=12),'small font');sizes.push({width,height,controlBottom:controls.bottom,fontMin:Math.min(...text.map(e=>parseFloat(w.getComputedStyle(e).fontSize)))});}return sizes;});
 }finally{if(old==null)localStorage.removeItem('sprite-check-background-v1');else localStorage.setItem('sprite-check-background-v1',old);frame.style.width='1440px';frame.style.height='940px';publish();}};
document.getElementById('prepare').onclick=async()=>{await fresh();$('paintTab').click();change('canvasBackgroundColor','#ffffff','input');app.paint.setTool('hand');app.paint.setColor([1,2,3,4]);physical=snapshot();const r=app.paint.canvas.getBoundingClientRect(),f=frame.getBoundingClientRect(),g=app.paint.geometry;status.dataset.targetX=f.left+r.left+g.x+g.scale/2;status.dataset.targetY=f.top+r.top+g.y+g.scale/2;status.textContent='Ready: Alt + left click the magenta sprite while PAN is selected';};
document.getElementById('measure').onclick=()=>{records.push({name:'Actual browser Alt+left click on sprite while PAN selected',status:eq(app.paint.color,[255,0,255,255])&&app.paint.tool==='hand'&&!app.paint.drag&&!app.paint.stroke&&snapshot()===physical?'PASS':'FAIL',details:{rgba:app.paint.color,tool:app.paint.tool,projectUnchanged:snapshot()===physical,pan:app.paint.pan}});publish();};
</script>
