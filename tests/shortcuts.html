<!doctype html><meta charset="utf-8"><title>Sprite Check keyboard verification</title>
<style>body{margin:0;background:#101521;color:#d9ece3;font:12px Consolas,monospace}header{display:flex;padding:10px;gap:15px;align-items:center}button{padding:10px;background:#a5f1d0;border:0;cursor:pointer}iframe{border:0;width:100%;height:calc(100vh - 58px)}ol{position:fixed;right:12px;top:52px;max-width:550px;line-height:1.7;background:#10291ff2;padding:15px 30px;z-index:5}ol:empty{display:none}</style>
<header><button id="run">Run keyboard checks</button><button id="hide">Hide results</button><button id="reset">Prepare real keyboard test</button><span id="status">Loading…</span></header><iframe id="app" src="../index.html" title="Keyboard test workspace"></iframe><ol id="results"></ol>
<script type="module">
const frame=document.getElementById('app'),results=document.getElementById('results'),status=document.getElementById('status');
const wait=async condition=>{const end=performance.now()+12000;while(!condition()){if(performance.now()>end)throw Error('Timed out');await new Promise(r=>setTimeout(r,25));}};
const assert=(v,msg)=>{if(!v)throw Error(msg);},add=msg=>{const li=document.createElement('li');li.textContent='PASS · '+msg;results.append(li);};
await wait(()=>frame.contentWindow.spriteCheck?.ready);status.textContent='Ready';
const key=(target,code,extra={})=>{const w=frame.contentWindow,e=new w.KeyboardEvent('keydown',{code,key:code==='Space'?' ':code.replace('Key','').toLowerCase(),bubbles:true,cancelable:true,...extra});target.dispatchEvent(e);return e;};
async function load(){const w=frame.contentWindow,d=frame.contentDocument,bytes=await(await fetch('../assets/test-sheet.png')).arrayBuffer(),files=new w.DataTransfer();files.items.add(new w.File([bytes],'keyboard.png',{type:'image/png'}));d.getElementById('fileInput').files=files.files;const previous=w.spriteCheck.project;d.getElementById('fileInput').dispatchEvent(new w.Event('change',{bubbles:true}));await wait(()=>w.spriteCheck.project!==previous&&!d.body.classList.contains('busy'));}
document.getElementById('run').onclick=async()=>{try{
 results.replaceChildren();status.textContent='Running…';const w=frame.contentWindow,d=frame.contentDocument,app=w.spriteCheck,$=id=>d.getElementById(id);
 key(d.body,'Space');assert(app.project===null&&!app.playing,'Empty shortcut changed state');add('Space is safe before a sheet is opened');await load();
 $('play').focus();const start=key($('play'),'Space');assert(start.defaultPrevented&&app.playing,'Space did not play');key($('play'),'Space',{repeat:true});key($('play'),'Space',{repeat:true});assert(app.playing,'Held Space toggled repeatedly');key($('play'),'Space');assert(!app.playing,'Second Space did not pause');add('Space plays/pauses exactly once; held-key repeats are ignored');
 for(const id of ['fps','holdTicks','loop','playbackMode','scrubber']){const loop=app.project.draft[0].loop;$(id).focus();const e=key($(id),'Space');assert(e.defaultPrevented&&app.playing,`Space failed with ${id} focus`);assert(app.project.draft[0].loop===loop,'Space changed Loop');key($(id),'Space');assert(!app.playing,'Pause failed');}add('Space works with number, checkbox, selector and slider focus');
 $('fps').value='22';$('fps').focus();key($('fps'),'Space');assert(app.project.draft[0].fps===22&&app.project.undoStack.length===1&&app.playing,'Pending FPS not committed exactly once');key(d.body,'Space');add('Pending numeric FPS commits exactly once before Space playback');
 $('compareTab').click();key(d.body,'Space');await new Promise(r=>setTimeout(r,120));assert(app.playing&&app.time>0&&!$('compareViewport').hidden,'Compare Space failed');key(d.body,'Space');add('Space advances and pauses Compare playback too');
 $('help').click();const modal=key(d.body,'Space');assert(!modal.defaultPrevented&&!app.playing,'Modal shortcut leaked');d.querySelector('#helpDialog .close-dialog').click();add('Modal dialogs retain their own keyboard behavior');
 for(let i=0;i<55;i++)$('holdPlus').click();assert(app.project.draft[0].keys[0].ticks===56&&app.project.undoStack.length===50,'History not capped');add('55 real UI edits retain only the latest 50 undo steps');
 $('holdTicks').focus();for(let i=0;i<50;i++)key($('holdTicks'),'KeyZ',{ctrlKey:true});assert(app.project.draft[0].keys[0].ticks===6&&app.project.redoStack.length===50,'50 undo failed');key(d.body,'KeyZ',{ctrlKey:true});assert(app.project.draft[0].keys[0].ticks===6&&$('undo').disabled,'Undo boundary failed');add('Ctrl+Z undoes 50 steps and stops at the oldest retained state');
 for(let i=0;i<50;i++)key(d.body,'KeyY',{ctrlKey:true});assert(app.project.draft[0].keys[0].ticks===56&&app.project.undoStack.length===50,'50 redo failed');key(d.body,'KeyY',{ctrlKey:true});assert(app.project.draft[0].keys[0].ticks===56&&$('redo').disabled,'Redo boundary failed');add('Ctrl+Y redoes all 50 steps and stops at the newest state');
 for(let i=0;i<50;i++)key(d.body,'KeyZ',{ctrlKey:true});$('holdPlus').click();assert(app.project.draft[0].keys[0].ticks===7&&!app.project.redoStack.length,'Redo branch not cleared');key(d.body,'KeyY',{ctrlKey:true});assert(app.project.draft[0].keys[0].ticks===7,'Stale redo applied');add('Editing after Undo clears the previous redo branch');
 key(d.body,'KeyZ',{ctrlKey:true,key:'ผ'});assert(app.project.draft[0].keys[0].ticks===6,'Thai Ctrl+Z failed');key(d.body,'KeyZ',{ctrlKey:true,shiftKey:true,key:'ผ'});assert(app.project.draft[0].keys[0].ticks===7,'Ctrl+Shift+Z failed');assert($('historyStatus').textContent.includes('UNDO 1/50'),'Counter not updated');add('Physical Thai-layout codes and Ctrl+Shift+Z work; history counters update');
 status.textContent='PASS 11 / 11';document.body.dataset.result='pass';
 }catch(error){status.textContent='FAIL '+error.message;const li=document.createElement('li');li.textContent=status.textContent;results.append(li);console.error(error);}};
document.getElementById('hide').onclick=()=>results.hidden=!results.hidden;
document.getElementById('reset').onclick=async()=>{await load();results.hidden=true;status.textContent='Ready for real Space / Ctrl+Z / Ctrl+Y';};
</script>
